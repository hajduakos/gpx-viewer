<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>GPX Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    background: #333; color: #e0e0e0;
  }

  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  #header h1 { font-size: 18px; color: #fff; white-space: nowrap; }
  #file-input {
    max-width: 200px; padding: 4px 8px;
    border: 1px solid #555; border-radius: 6px;
    background: #333; color: #e0e0e0; font-size: 12px;
    cursor: pointer;
  }
  #file-input::file-selector-button {
    background: #fff; color: #222; border: none;
    padding: 4px 12px; border-radius: 4px; cursor: pointer;
    margin-right: 8px; font-size: 13px;
  }
  #settings-wrapper {
    position: relative; margin-left: auto;
    display: flex; align-items: center; gap: 8px;
  }
  .header-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid #555; border-radius: 6px;
    background: transparent; color: #fff; font-size: 13px; cursor: pointer;
  }
  .header-btn:hover { background: rgba(255,255,255,0.1); }
  #settings-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 200px; padding: 12px;
    background: rgba(51, 51, 51, 0.85); backdrop-filter: blur(6px);
    border: 1px solid #555; border-radius: 8px; z-index: 1001;
  }
  #settings-dropdown.open { display: block; }
  #settings-dropdown label {
    display: block; font-size: 11px; text-transform: uppercase;
    color: #fff; margin-bottom: 6px; letter-spacing: 0.5px;
  }
  #tile-select {
    flex: 1; padding: 6px 10px; border: 1px solid #555; border-radius: 6px;
    background: #333; color: #e0e0e0; font-size: 13px; cursor: pointer;
  }
  #track-name { font-size: 20px; font-weight: 600; color: #fff; }

  #map-wrapper { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; }
  .leaflet-tile-pane { filter: brightness(1) opacity(1); }
  .leaflet-top.leaflet-left { top: 52px; }

  #overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 1000; pointer-events: none;
  }
  #overlay > * { pointer-events: auto; }

  #stats {
    display: none; padding: 14px 20px;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
  }
  #stats-grid {
    display: flex; flex-wrap: wrap; gap: 4px 32px;
    justify-content: center;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; color: #fff; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 600; color: #fff; }
  .stat-unit { font-size: 12px; color: #fff; }

  #elevation-chart {
    display: none; height: 100px; padding: 8px 20px 4px;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
  }
  #elevation-canvas { width: 100%; height: 100%; }


  #tracks-panel {
    display: none; position: absolute; right: 0;
    max-width: 50%; z-index: 999; overflow-y: auto;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
    padding: 16px;
  }
  #tracks-panel.open { display: block; }

  #tracks-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  #tracks-table th {
    text-align: left; padding: 6px 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #fff; border-bottom: 1px solid #555;
    white-space: nowrap;
  }
  #tracks-table td {
    padding: 6px 8px; color: #e0e0e0; border-bottom: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
  }
  #tracks-table tr:hover td { background: rgba(255,255,255,0.05); }

  .settings-row {
    display: flex; align-items: center; gap: 8px;
  }
  .settings-row-spaced { margin-top: 4px; }
  .settings-divider {
    border: none; border-top: 1px solid #555; margin: 8px 0;
  }
  .settings-label-inline { margin: 0; white-space: nowrap; }
  .slider-value {
    font-size: 13px; color: #fff; min-width: 40px; text-align: right; white-space: nowrap;
  }
  .settings-checkbox { margin-left: auto; }
  .color-picker {
    width: 48px; height: 28px;
    border: 1px solid #555; border-radius: 4px;
    background: transparent; cursor: pointer; padding: 0;
  }
  .slider { width: 150px; margin-left: auto; }
</style>
</head>
<body>

<div id="header">
  <h1>GPX Viewer</h1>
  <input type="file" id="file-input" accept=".gpx" multiple>
  <span id="track-name"></span>
  <div id="settings-wrapper">
    <button id="tracks-btn" class="header-btn">Tracks</button>
    <button id="elevation-btn" class="header-btn">Elevation</button>
    <button id="export-png-btn" class="header-btn">Export PNG</button>
    <button id="settings-btn" class="header-btn">
      Settings
    </button>
    <div id="settings-dropdown">
      <div class="settings-row">
        <label for="smoothing" class="settings-label-inline">Track smoothing</label>
        <input type="range" id="smoothing" min="0" max="50" step="1" value="5" class="slider">
        <span id="smoothing-value" class="slider-value">5</span>
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="min-render-dist" class="settings-label-inline">Min point distance</label>
        <input type="range" id="min-render-dist" min="0" max="100" step="1" value="10" class="slider">
        <span id="min-render-dist-value" class="slider-value">10 m</span>
      </div>
      <hr class="settings-divider">
      <div class="settings-row settings-row-spaced">
        <label for="tile-select" class="settings-label-inline">Map type</label>
        <select id="tile-select"></select>
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="map-brightness" class="settings-label-inline">Map brightness</label>
        <input type="range" id="map-brightness" min="0" max="1" step="0.05" value="1" class="slider">
        <span id="map-brightness-value" class="slider-value">1</span>
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="map-opacity" class="settings-label-inline">Map opacity</label>
        <input type="range" id="map-opacity" min="0" max="1" step="0.05" value="1" class="slider">
        <span id="map-opacity-value" class="slider-value">1</span>
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="gradient-low" class="settings-label-inline">Line color</label>
        <span class="slider-value" style="margin-left:auto">Min</span>
        <input type="color" id="gradient-low" value="#6b0f1d" class="color-picker">
        <span class="slider-value">Max</span>
        <input type="color" id="gradient-high" value="#e94560" class="color-picker">
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="line-width" class="settings-label-inline">Line width</label>
        <input type="range" id="line-width" min="1" max="10" step="0.5" value="4" class="slider">
        <span id="line-width-value" class="slider-value">4</span>
      </div>
      <hr class="settings-divider">
      <div class="settings-row settings-row-spaced">
        <label for="show-zoom" class="settings-label-inline">Zoom controls</label>
        <input type="checkbox" id="show-zoom" class="settings-checkbox">
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="show-markers" class="settings-label-inline">Markers</label>
        <input type="checkbox" id="show-markers" checked class="settings-checkbox">
      </div>
      <div class="settings-row settings-row-spaced">
        <label for="show-highest" class="settings-label-inline">Highest point</label>
        <input type="checkbox" id="show-highest" class="settings-checkbox">
      </div>
    </div>
  </div>
</div>

<div id="map-wrapper">
  <div id="map"></div>
  <div id="tracks-panel"></div>
</div>

<div id="overlay">
  <div id="elevation-chart">
    <canvas id="elevation-canvas"></canvas>
  </div>
  <div id="stats">
    <div id="stats-grid"></div>
  </div>
</div>

<script>
const tileLayers = {
  'OpenTopoMap': { url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', maxZoom: 17, attr: '&copy; OpenTopoMap' },
  'OpenStreetMap': { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom: 19, attr: '&copy; OpenStreetMap contributors' },
  'OSM Hot': { url: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', maxZoom: 19, attr: '&copy; OpenStreetMap contributors, HOT style' },
  'CyclOSM': { url: 'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', maxZoom: 20, attr: '&copy; CyclOSM / OpenStreetMap' },
  'CartoDB Positron': { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', maxZoom: 20, attr: '&copy; CARTO, OSM' },
  'CartoDB Dark Matter': { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', maxZoom: 20, attr: '&copy; CARTO, OSM' },
  'CartoDB Voyager': { url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', maxZoom: 20, attr: '&copy; CARTO, OSM' },
  'Esri World Street Map': { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attr: '&copy; Esri' },
  'Esri World Topo': { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attr: '&copy; Esri' },
  'Esri World Imagery': { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attr: '&copy; Esri' },
};

const map = L.map('map', { zoomControl: false }).setView([47.5, 19.0], 6);
map.zoomControl = L.control.zoom();

let currentTile = null;

const select = document.getElementById('tile-select');
Object.keys(tileLayers).forEach(name => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  select.appendChild(opt);
});

function setTileLayer(name) {
  const t = tileLayers[name];
  if (currentTile) map.removeLayer(currentTile);
  currentTile = L.tileLayer(t.url, { maxZoom: t.maxZoom, attribution: t.attr }).addTo(map);
}

select.addEventListener('change', () => setTileLayer(select.value));
setTileLayer(select.value);

const settingsBtn = document.getElementById('settings-btn');
const settingsDropdown = document.getElementById('settings-dropdown');
settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsDropdown.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!settingsDropdown.contains(e.target) && e.target !== settingsBtn) {
    settingsDropdown.classList.remove('open');
  }
});

const tracksBtn = document.getElementById('tracks-btn');
const tracksPanel = document.getElementById('tracks-panel');
const headerEl = document.getElementById('header');
const overlayEl = document.getElementById('overlay');
const elevationChart = document.getElementById('elevation-chart');
const elevationCanvas = document.getElementById('elevation-canvas');
const trackNameEl = document.getElementById('track-name');
const statsEl = document.getElementById('stats');
const statsGrid = document.getElementById('stats-grid');
function updateTracksPanelPosition() {
  const headerH = headerEl.offsetHeight;
  const overlayH = overlayEl.offsetHeight;
  tracksPanel.style.top = (headerH - 1) + 'px';
  tracksPanel.style.bottom = '';
  tracksPanel.style.maxHeight = (window.innerHeight - headerH - overlayH + 2) + 'px';
}
tracksBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  tracksPanel.classList.toggle('open');
  if (tracksPanel.classList.contains('open')) {
    tracksBtn.style.background = 'rgba(255,255,255,0.15)';
    updateTracksPanelPosition();
  } else {
    tracksBtn.style.background = '';
  }
});

const elevationBtn = document.getElementById('elevation-btn');
let elevationVisible = true;
elevationBtn.style.background = 'rgba(255,255,255,0.15)';
elevationBtn.addEventListener('click', () => {
  elevationVisible = !elevationVisible;
  elevationBtn.style.background = elevationVisible ? 'rgba(255,255,255,0.15)' : '';
  if (elevationVisible && lastElevationData) {
    elevationChart.style.display = 'block';
    drawElevationChart(lastElevationData);
  } else {
    elevationChart.style.display = 'none';
  }
  if (tracksPanel.classList.contains('open')) updateTracksPanelPosition();
});

document.getElementById('export-png-btn').addEventListener('click', () => {
  html2canvas(document.body, { useCORS: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'gpx-viewer.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

let allTracks = [];
let markerHighest = null;
const minRenderDistSlider = document.getElementById('min-render-dist');
const minRenderDistValue = document.getElementById('min-render-dist-value');
minRenderDistSlider.addEventListener('input', () => {
  minRenderDistValue.textContent = minRenderDistSlider.value + ' m';
  if (allTracks.length > 0) renderAllTracks({ fitBounds: false });
});

function clearAllTracks() {
  console.log(`Clearing ${allTracks.length} existing track(s)...`);
  allTracks.forEach(t => {
    if (t.trackLayer) map.removeLayer(t.trackLayer);
    if (t.markerStart) map.removeLayer(t.markerStart);
    if (t.markerEnd) map.removeLayer(t.markerEnd);
    t.trackLayer = null;
    t.markerStart = null;
    t.markerEnd = null;
  });
  if (markerHighest) { map.removeLayer(markerHighest); markerHighest = null; }
}

const mapBrightnessSlider = document.getElementById('map-brightness');
const mapBrightnessValue = document.getElementById('map-brightness-value');
const mapOpacitySlider = document.getElementById('map-opacity');
const mapOpacityValue = document.getElementById('map-opacity-value');
function updateTileFilter() {
  map.getPane('tilePane').style.filter = 'brightness(' + mapBrightnessSlider.value + ') opacity(' + mapOpacitySlider.value + ')';
}
mapBrightnessSlider.addEventListener('input', () => {
  mapBrightnessValue.textContent = mapBrightnessSlider.value;
  updateTileFilter();
});
mapOpacitySlider.addEventListener('input', () => {
  mapOpacityValue.textContent = mapOpacitySlider.value;
  updateTileFilter();
});

const lineWidthSlider = document.getElementById('line-width');
const lineWidthValue = document.getElementById('line-width-value');
const gradientLow = document.getElementById('gradient-low');
const gradientHigh = document.getElementById('gradient-high');

function setTrackLayerStyle(style) {
  allTracks.forEach(t => {
    if (t.trackLayer) t.trackLayer.eachLayer(l => l.setStyle(style));
  });
}

gradientLow.addEventListener('input', () => { if (allTracks.length > 0) renderAllTracks({ fitBounds: false }); });
gradientHigh.addEventListener('input', () => { if (allTracks.length > 0) renderAllTracks({ fitBounds: false }); });

lineWidthSlider.addEventListener('input', () => {
  lineWidthValue.textContent = lineWidthSlider.value;
  setTrackLayerStyle({ weight: parseFloat(lineWidthSlider.value) });
});


const smoothingSlider = document.getElementById('smoothing');
const smoothingValue = document.getElementById('smoothing-value');
smoothingSlider.addEventListener('input', () => {
  smoothingValue.textContent = smoothingSlider.value;
  if (allTracks.length > 0) renderAllTracks({ fitBounds: false });
});

const showZoom = document.getElementById('show-zoom');
showZoom.addEventListener('change', () => {
  if (showZoom.checked) {
    map.addControl(map.zoomControl);
  } else {
    map.removeControl(map.zoomControl);
  }
});

const showMarkers = document.getElementById('show-markers');
showMarkers.addEventListener('change', () => {
  allTracks.forEach(t => {
    [t.markerStart, t.markerEnd].forEach(m => {
      if (!m) return;
      if (showMarkers.checked) m.addTo(map);
      else map.removeLayer(m);
    });
  });
});

const showHighest = document.getElementById('show-highest');
showHighest.addEventListener('change', () => {
  if (!markerHighest) return;
  if (showHighest.checked) markerHighest.addTo(map);
  else map.removeLayer(markerHighest);
});

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  files.sort((a, b) => a.name.localeCompare(b.name));
  console.log(`Reading ${files.length} file(s)...`);
  let loaded = 0;
  const parsed = new Array(files.length);
  trackNameEl.textContent = 'Loading 0/' + files.length + '...';
  files.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = ev => {
      parsed[idx] = parseGPX(ev.target.result);
      console.log(`Loaded "${file.name}": ${parsed[idx] ? parsed[idx].rawPoints.length : 0} points`);
      loaded++;
      trackNameEl.textContent = 'Loading ' + loaded + '/' + files.length + '...';
      if (loaded === files.length) {
        clearAllTracks();
        allTracks = parsed.filter(t => t !== null);
        if (allTracks.length > 0) renderAllTracks();
      }
    };
    reader.readAsText(file);
  });
});

function parseGPX(xmlStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, 'application/xml');

  const trk = doc.querySelector('trk');
  const name = trk?.querySelector('name')?.textContent || 'Unnamed';
  const type = trk?.querySelector('type')?.textContent || 'Unknown';

  const rawPoints = [];
  doc.querySelectorAll('trkpt').forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    const eleEl = pt.querySelector('ele');
    const timeEl = pt.querySelector('time');
    rawPoints.push({
      lat, lon,
      ele: eleEl ? parseFloat(eleEl.textContent) : null,
      time: timeEl ? new Date(timeEl.textContent) : null,
    });
  });

  if (rawPoints.length === 0) return null;
  return { rawPoints, name, type, trackLayer: null, markerStart: null, markerEnd: null };
}

function smoothPoints(points, windowSize) {
  if (windowSize <= 0) return points;
  const half = Math.floor(windowSize / 2);
  return points.map((p, i) => {
    const start = Math.max(0, i - half);
    const end = Math.min(points.length - 1, i + half);
    let lat = 0, lon = 0, ele = 0, eleCount = 0;
    for (let j = start; j <= end; j++) {
      lat += points[j].lat;
      lon += points[j].lon;
      if (points[j].ele != null) { ele += points[j].ele; eleCount++; }
    }
    const n = end - start + 1;
    return {
      lat: lat / n, lon: lon / n,
      ele: eleCount > 0 ? ele / eleCount : p.ele,
      time: p.time,
    };
  });
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function lerpColor(hex1, hex2, t) {
  const [r1, g1, b1] = hexToRgb(hex1);
  const [r2, g2, b2] = hexToRgb(hex2);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function renderAllTracks({ fitBounds = true } = {}) {
  clearAllTracks();
  console.log(`Rendering ${allTracks.length} track(s)...`);

  // Track name
  trackNameEl.textContent = allTracks.length === 1
    ? allTracks[0].name
    : allTracks.length + ' tracks';

  const smoothWindow = parseInt(smoothingSlider.value);
  const minRenderDist = parseInt(minRenderDistSlider.value);
  console.log(`Smoothing level: ${smoothWindow}, min render distance: ${minRenderDist} m`);
  const allBounds = L.latLngBounds();
  const elevationSegments = [];

  // Pre-compute global elevation range (needed for gradient coloring)
  let globalMinEle = Infinity, globalMaxEle = -Infinity;
  allTracks.forEach(track => {
    track.rawPoints.forEach(p => {
      if (p.ele != null) {
        if (p.ele < globalMinEle) globalMinEle = p.ele;
        if (p.ele > globalMaxEle) globalMaxEle = p.ele;
      }
    });
  });

  // Aggregated stats accumulators
  let totalDist = 0, totalElevGain = 0;
  let totalElapsedSec = 0, hasElapsed = false;
  let totalMovingSec = 0, hasMoving = false;
  let earliestDate = null, latestDate = null;
  const types = new Set();
  let globalHighestEle = -Infinity, globalHighestLat = null, globalHighestLon = null;

  allTracks.forEach(track => {
    const points = smoothPoints(track.rawPoints, smoothWindow);

    // Filter points (skip those within minRenderDist of the last rendered point)
    const rendered = [{ lat: points[0].lat, lon: points[0].lon, ele: points[0].ele }];
    for (let i = 1; i < points.length; i++) {
      const prev = rendered[rendered.length - 1];
      if (i === points.length - 1 || haversine(prev.lat, prev.lon, points[i].lat, points[i].lon) >= minRenderDist) {
        rendered.push({ lat: points[i].lat, lon: points[i].lon, ele: points[i].ele });
      }
    }
    const latlngs = rendered.map(p => [p.lat, p.lon]);
    console.log(`Track "${track.name}": ${latlngs.length}/${points.length} points rendered`);

    const weight = parseFloat(lineWidthSlider.value);
    const opacity = 1;

    const layers = [];
    for (let i = 0; i < rendered.length - 1; i++) {
      const e1 = rendered[i].ele ?? 0;
      const e2 = rendered[i + 1].ele ?? 0;
      const avgEle = (e1 + e2) / 2;
      const t = (globalMaxEle > globalMinEle) ? (avgEle - globalMinEle) / (globalMaxEle - globalMinEle) : 0;
      const color = lerpColor(gradientLow.value, gradientHigh.value, t);
      layers.push(L.polyline([latlngs[i], latlngs[i + 1]], { color, weight, opacity }));
    }
    track.trackLayer = L.layerGroup(layers).addTo(map);
    allBounds.extend(L.latLngBounds(latlngs));

    // Start / End markers (colors may be updated to yellow for mid-points after the loop)
    const startIcon = L.divIcon({ className: '', html: '<div style="width:14px;height:14px;background:#00c853;border:2px solid #fff;border-radius:50%;"></div>', iconSize: [14,14], iconAnchor: [7,7] });
    const endIcon = L.divIcon({ className: '', html: '<div style="width:14px;height:14px;background:#e94560;border:2px solid #fff;border-radius:50%;"></div>', iconSize: [14,14], iconAnchor: [7,7] });
    const startEle = rendered[0].ele;
    const endEle = rendered[rendered.length - 1].ele;
    const startPopup = 'Start of ' + track.name + (startEle != null ? '<br>' + Math.round(startEle) + ' m' : '');
    const endPopup = 'End of ' + track.name + (endEle != null ? '<br>' + Math.round(endEle) + ' m' : '');
    track.markerStart = L.marker(latlngs[0], { icon: startIcon }).bindPopup(startPopup);
    track.markerEnd = L.marker(latlngs[latlngs.length - 1], { icon: endIcon }).bindPopup(endPopup);

    // Track global highest point
    for (let i = 0; i < points.length; i++) {
      if (points[i].ele != null && points[i].ele > globalHighestEle) {
        globalHighestEle = points[i].ele;
        globalHighestLat = points[i].lat;
        globalHighestLon = points[i].lon;
      }
    }

    // Per-track stats
    let trackDist = 0, elevGain = 0;
    let minEle = Infinity, maxEle = -Infinity;
    const distances = [0];

    for (let i = 1; i < points.length; i++) {
      const d = haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
      trackDist += d;
      distances.push(trackDist);
      if (points[i].ele != null && points[i - 1].ele != null) {
        const diff = points[i].ele - points[i - 1].ele;
        if (diff > 0) elevGain += diff;
      }
      if (points[i].ele != null) {
        if (points[i].ele < minEle) minEle = points[i].ele;
        if (points[i].ele > maxEle) maxEle = points[i].ele;
      }
    }
    if (points[0].ele != null) {
      if (points[0].ele < minEle) minEle = points[0].ele;
      if (points[0].ele > maxEle) maxEle = points[0].ele;
    }

    totalDist += trackDist;
    totalElevGain += elevGain;

    // Time stats
    const startTime = points[0].time;
    const endTime = points[points.length - 1].time;
    if (startTime && endTime) {
      totalElapsedSec += (endTime - startTime) / 1000;
      hasElapsed = true;
      if (!earliestDate || startTime < earliestDate) earliestDate = startTime;
      if (!latestDate || endTime > latestDate) latestDate = endTime;
    }
    const movingData = computeMovingTime(points);
    if (movingData) {
      totalMovingSec += movingData.movingSec;
      hasMoving = true;
    }

    types.add(track.type);
    elevationSegments.push({ points, distances });

    // Store per-track stats for table
    track._stats = {
      dist: trackDist,
      elevGain,
      minEle: minEle === Infinity ? null : minEle,
      maxEle: maxEle === -Infinity ? null : maxEle,
      elapsedSec: (startTime && endTime) ? (endTime - startTime) / 1000 : null,
      movingSec: movingData ? movingData.movingSec : null,
      date: startTime,
    };
  });

  // Global highest point marker
  if (globalHighestLat != null) {
    const highIcon = L.divIcon({ className: '', html: '<div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #2196f3;filter:drop-shadow(0 0 2px rgba(0,0,0,0.5));"></div>', iconSize: [16,14], iconAnchor: [8,14] });
    markerHighest = L.marker([globalHighestLat, globalHighestLon], { icon: highIcon }).bindPopup('Highest: ' + Math.round(globalHighestEle) + ' m');
    if (showHighest.checked) markerHighest.addTo(map);
  }

  // Recolor close end/start markers to yellow
  const MID_DIST_THRESHOLD = 100;
  const midIcon = L.divIcon({ className: '', html: '<div style="width:14px;height:14px;background:#ffd600;border:2px solid #fff;border-radius:50%;"></div>', iconSize: [14,14], iconAnchor: [7,7] });
  for (let i = 0; i < allTracks.length - 1; i++) {
    const curEnd = allTracks[i].rawPoints[allTracks[i].rawPoints.length - 1];
    const nextStart = allTracks[i + 1].rawPoints[0];
    if (haversine(curEnd.lat, curEnd.lon, nextStart.lat, nextStart.lon) < MID_DIST_THRESHOLD) {
      allTracks[i].markerEnd.setIcon(midIcon);
      allTracks[i + 1].markerStart.setIcon(midIcon);
    }
  }

  // Add all markers to map
  if (showMarkers.checked) {
    allTracks.forEach(t => {
      if (t.markerStart) t.markerStart.addTo(map);
      if (t.markerEnd) t.markerEnd.addTo(map);
    });
  }

  if (fitBounds) map.fitBounds(allBounds, { padding: [30, 30] });

  // Aggregated stats display
  const distKm = totalDist / 1000;
  const activityStr = types.size === 1 ? [...types][0] : 'Multiple';
  const activityDisplay = activityStr.charAt(0).toUpperCase() + activityStr.slice(1);

  let dateStr = '—';
  if (earliestDate) {
    if (allTracks.length === 1) {
      dateStr = formatDateFull(earliestDate);
    } else {
      const d1 = formatDateFull(earliestDate);
      const d2 = formatDateFull(latestDate);
      if (d1 === d2) {
        dateStr = d1;
      } else if (earliestDate.getFullYear() === latestDate.getFullYear()) {
        dateStr = formatDateShort(earliestDate) + ' — ' + formatDateFull(latestDate);
      } else {
        dateStr = d1 + ' — ' + d2;
      }
    }
  }

  const timeStr = hasElapsed ? formatDuration(totalElapsedSec) : '—';
  const avgSpeed = hasElapsed && totalElapsedSec > 0 ? (distKm / (totalElapsedSec / 3600)).toFixed(1) : '—';
  const movingTimeStr = hasMoving ? formatDuration(totalMovingSec) : '—';
  const movingAvg = (hasMoving && totalMovingSec > 0) ? (distKm / (totalMovingSec / 3600)).toFixed(1) : '—';

  const stats = [
    { label: 'Activity', value: activityDisplay, unit: '' },
    { label: 'Date', value: dateStr, unit: '' },
    { label: 'Distance', value: distKm.toFixed(2), unit: 'km' },
    { label: 'Elapsed Time', value: timeStr, unit: '' },
    { label: 'Moving Time', value: movingTimeStr, unit: '' },
    { label: 'Elev. Gain', value: Math.round(totalElevGain), unit: 'm' },
    { label: 'Min / Max Elev.', value: Math.round(globalMinEle) + ' / ' + Math.round(globalMaxEle), unit: 'm' },
    { label: 'Avg Speed', value: avgSpeed, unit: 'km/h' },
    { label: 'Moving Avg', value: movingAvg, unit: 'km/h' },
  ];

  statsGrid.innerHTML = '';
  stats.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = `<span class="stat-label">${s.label}</span><span class="stat-value">${s.value} <span class="stat-unit">${s.unit}</span></span>`;
    statsGrid.appendChild(div);
  });
  statsEl.style.display = 'block';

  // Tracks table
  const showType = types.size > 1;
  let tableHtml = '<table id="tracks-table"><thead><tr>' +
    '<th>Name</th>' + (showType ? '<th>Type</th>' : '') + '<th>Date</th><th>Distance</th><th>Elapsed</th><th>Moving</th><th>Gain</th><th>Min Elev.</th><th>Max Elev.</th>' +
    '</tr></thead><tbody>';
  allTracks.forEach((t, idx) => {
    const s = t._stats;
    const dk = (s.dist / 1000).toFixed(2);
    const el = s.elapsedSec != null ? formatDuration(s.elapsedSec) : '—';
    const mv = s.movingSec != null ? formatDuration(s.movingSec) : '—';
    const gn = Math.round(s.elevGain);
    const mn = s.minEle != null ? Math.round(s.minEle) + ' m' : '—';
    const mx = s.maxEle != null ? Math.round(s.maxEle) + ' m' : '—';
    const tp = t.type.charAt(0).toUpperCase() + t.type.slice(1);
    tableHtml += `<tr data-track-idx="${idx}"><td>${t.name}</td>${showType ? '<td>' + tp + '</td>' : ''}<td>${s.date ? formatDateFull(s.date) : '—'}</td><td>${dk} km</td><td>${el}</td><td>${mv}</td><td>${gn} m</td><td>${mn}</td><td>${mx}</td></tr>`;
  });
  tableHtml += '</tbody></table>';
  tracksPanel.innerHTML = tableHtml;

  // Highlight track on hover
  const baseWeight = parseFloat(lineWidthSlider.value);
  function setLayerWeight(layer, val) {
    if (!layer) return;
    layer.getLayers().forEach(l => l.setStyle({ weight: val }));
  }
  tracksPanel.querySelectorAll('tr[data-track-idx]').forEach(row => {
    row.addEventListener('mouseenter', () => {
      const i = parseInt(row.dataset.trackIdx);
      allTracks.forEach((t, j) => setLayerWeight(t.trackLayer, j === i ? baseWeight * 2 : baseWeight));
    });
    row.addEventListener('mouseleave', () => {
      allTracks.forEach(t => setLayerWeight(t.trackLayer, baseWeight));
    });
  });

  // Elevation chart
  drawElevationChart(elevationSegments);

  if (tracksPanel.classList.contains('open')) updateTracksPanelPosition();
}

const toRad = x => x * Math.PI / 180;

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
}

function formatDateFull(d) {
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatDateShort(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function computeMovingTime(points) {
  if (!points[0].time) return null;
  let movingSec = 0;
  const speedThreshold = 0.2; // m/s — below this is "stopped"
  for (let i = 1; i < points.length; i++) {
    if (!points[i].time || !points[i - 1].time) continue;
    const dt = (points[i].time - points[i - 1].time) / 1000;
    if (dt <= 0) continue;
    const d = haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
    if (d / dt >= speedThreshold) movingSec += dt;
  }
  return { movingSec };
}

let lastElevationData = null;

function drawElevationChart(segments) {
  lastElevationData = segments;

  const hasEle = segments.some(seg => seg.points.some(p => p.ele != null));
  if (!hasEle || !elevationVisible) { elevationChart.style.display = 'none'; return; }

  elevationChart.style.display = 'block';
  const ctx = elevationCanvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = elevationCanvas.getBoundingClientRect();
  elevationCanvas.width = rect.width * dpr;
  elevationCanvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  // Compute global elevation range
  let globalMinE = Infinity, globalMaxE = -Infinity;
  segments.forEach(seg => {
    seg.points.forEach(p => {
      const e = p.ele ?? 0;
      if (e < globalMinE) globalMinE = e;
      if (e > globalMaxE) globalMaxE = e;
    });
  });
  const minE = globalMinE - 20;
  const maxE = globalMaxE + 20;

  // Compute total distance with gaps between segments
  let totalSegDist = 0;
  segments.forEach(seg => {
    const lastD = seg.distances[seg.distances.length - 1];
    totalSegDist += lastD;
  });
  const numGaps = segments.length > 1 ? segments.length - 1 : 0;
  const gapPx = 1;
  const usableW = W - numGaps * gapPx;

  ctx.clearRect(0, 0, W, H);

  let cumPxOffset = 0;
  segments.forEach((seg, segIdx) => {
    const segMaxD = seg.distances[seg.distances.length - 1];
    const segW = totalSegDist > 0 ? (segMaxD / totalSegDist) * usableW : 0;

    // Precompute coordinates
    const coords = seg.points.map((p, i) => ({
      x: cumPxOffset + (segMaxD > 0 ? (seg.distances[i] / segMaxD) * segW : 0),
      y: H - (((p.ele ?? 0) - minE) / (maxE - minE)) * H,
    }));

    // Fill
    ctx.beginPath();
    ctx.moveTo(cumPxOffset, H);
    coords.forEach(c => ctx.lineTo(c.x, c.y));
    ctx.lineTo(cumPxOffset + segW, H);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(255,255,255,0.4)');
    grad.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    coords.forEach((c, i) => i === 0 ? ctx.moveTo(c.x, c.y) : ctx.lineTo(c.x, c.y));
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    cumPxOffset += segW + gapPx;
  });

  // Axis labels
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.fillText(Math.round(maxE) + ' m', 4, 12);
  ctx.fillText(Math.round(minE) + ' m', 4, H - 4);
  ctx.fillText((totalSegDist / 1000).toFixed(1) + ' km', W - 50, H - 4);
}

window.addEventListener('resize', () => {
  if (lastElevationData) drawElevationChart(lastElevationData);
  if (tracksPanel.classList.contains('open')) updateTracksPanelPosition();
});
</script>
