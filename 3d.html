<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GPX Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        #landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 28px;
        }
        #landing h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .file-picker {
            position: relative;
            padding: 24px 48px;
            background: rgba(255,255,255,0.04);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .file-picker:hover, .file-picker.dragover {
            border-color: #4facfe;
            background: rgba(79,172,254,0.06);
        }
        .file-picker input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .settings {
            display: flex;
            gap: 32px;
            font-size: 0.85rem;
            color: #777;
        }
        .settings label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings input[type=range] { width: 100px; }
        .settings .val { min-width: 32px; text-align: right; color: #bbb; }

        #progress {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f0f1a;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        #progress.active { display: flex; }
        #progress-step {
            font-size: 1.05rem;
            color: #aaa;
        }
        .bar-wrap {
            width: 420px;
            max-width: 80vw;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border-radius: 3px;
            transition: width 0.15s;
        }
        #progress-pct {
            font-size: 1.6rem;
            font-weight: 300;
            color: #4facfe;
        }
        #progress-detail {
            font-size: 0.8rem;
            color: #555;
            height: 18px;
        }

        #viewer {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #viewer.active { display: block; }
        #viewer canvas { display: block; }

        #rotate-box {
            display: none;
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(15,15,26,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 16px;
            z-index: 10;
            flex-direction: column;
            gap: 10px;
            min-width: 280px;
        }
        #rotate-box.active { display: flex; }
        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ctrl-label {
            font-size: 0.8rem;
            color: #999;
            white-space: nowrap;
        }
        #btn-animate:hover { background: rgba(255,255,255,0.1); color: #fff; }
        #btn-animate.playing { color: #4facfe; border-color: #4facfe; }
        #btn-animate {
            width: 32px; height: 32px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.04);
            color: #ccc; font-size: 14px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        #rot-speed { width: 80px; flex: 1; }
        #sel-highlight, #sel-camera-mode, #sel-end-marker, #txt-start-label, #txt-end-label {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            color: #ccc;
            font-size: 0.8rem;
            padding: 4px 6px;
            flex: 1;
            min-width: 0;
        }
        #sel-camera-mode { flex: none; }
        #btn-advanced {
            background: none;
            border: none;
            color: #777;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0;
            text-align: left;
            transition: color 0.2s;
        }
        #btn-advanced:hover { color: #bbb; }
        .ctrl-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            color: #ccc;
            font-size: 0.8rem;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        #advanced-settings {
            display: none;
            flex-direction: column;
            gap: 6px;
        }
        #advanced-settings.open { display: flex; }
        #advanced-settings label {
            font-size: 0.8rem;
            color: #999;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .adv-section-title {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .adv-divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 4px 0 2px;
        }

        #stats-box {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(15,15,26,0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 16px;
            z-index: 20;
            flex-direction: column;
            gap: 6px;
            max-width: 520px;
            transition: max-width 0.2s;
        }
        #stats-box.active { display: flex; }
        #stats-box.expanded { max-width: 700px; max-height: calc(100vh - 32px); overflow-y: auto; }
        #stats-box .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            gap: 16px;
        }
        #stats-box .stat-label { color: #999; }
        #stats-box .stat-value { color: #e0e0e0; text-align: right; }
        #stats-box .stat-title {
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 500;
            margin-bottom: 2px;
        }
        #btn-details {
            background: none;
            border: none;
            color: #777;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0;
            text-align: left;
            transition: color 0.2s;
        }
        #btn-details:hover { color: #bbb; }
        #stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        #stats-table th {
            text-align: left;
            padding: 6px 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            border-bottom: 1px solid #555;
            white-space: nowrap;
        }
        #stats-table td {
            padding: 6px 8px;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            white-space: nowrap;
        }
        #stats-table tr:hover td { background: rgba(255,255,255,0.05); }

        #anim-stats {
            display: none;
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            pointer-events: none;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 22px;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div id="landing">
        <h1>3D GPX Viewer</h1>
        <div class="file-picker" id="dropzone">
            <span>Browse or drop GPX files</span>
            <input type="file" accept=".gpx" id="file-input" multiple>
        </div>
        <div class="file-picker" id="import-zone" style="padding:14px 32px;font-size:0.85rem;border-style:solid;color:#777">
            <span>or import saved scene data (.gpx3d)</span>
            <input type="file" accept=".gpx3d,.json" id="import-input">
        </div>
        <div class="settings">
            <label>
                Grid resolution
                <input type="range" id="set-grid" min="50" max="1000" value="600" step="10">
                <span class="val" id="set-grid-v">600</span>
            </label>
            <label>
                Texture tiles
                <input type="range" id="set-tiles" min="1" max="4" value="1" step="1">
                <span class="val" id="set-tiles-v">1×1</span>
            </label>
            <label>
                Resolution per tile
                <input type="range" id="set-tex" min="1024" max="8192" value="2048" step="1024">
                <span class="val" id="set-tex-v">2048</span>
            </label>
            <label>
                Padding
                <input type="range" id="set-pad" min="5" max="300" value="100" step="5">
                <span class="val" id="set-pad-v">100%</span>
            </label>
        </div>
    </div>

    <div id="progress">
        <div id="progress-step">Initializing...</div>
        <div class="bar-wrap"><div id="progress-fill"></div></div>
        <div id="progress-pct">0%</div>
        <div id="progress-detail"></div>
    </div>

    <div id="viewer"></div>

    <div id="stats-box"></div>

    <div id="anim-stats"></div>

    <div id="rotate-box">
        <div class="ctrl-row">
            <span class="ctrl-label">Camera</span>
            <button id="btn-recenter" class="ctrl-btn">Re-center</button>
            <select id="sel-camera-mode">
                <option value="orbit-left">Orbit (left)</option>
                <option value="orbit-right">Orbit (right)</option>
                <option value="forward">Forward</option>
                <option value="backward">Backward</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
            </select>
            <span class="ctrl-label">Speed</span>
            <input type="range" id="rot-speed" min="0.25" max="5" value="0.5" step="0.25">
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Highlight</span>
            <select id="sel-highlight"></select>
            <button id="btn-center" class="ctrl-btn" disabled>Center</button>
            <button id="btn-head" class="ctrl-btn" disabled>Head</button>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Animate</span>
            <button id="btn-animate" title="Animate selected track" disabled>&#9654;</button>
            <span class="ctrl-label">Duration</span>
            <input type="range" id="sld-animate-dur" min="1" max="10" value="2" step="1" style="flex:1">
            <span class="ctrl-label" id="animate-dur-val">2s</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Start label</span>
            <input type="text" id="txt-start-label" value="Start">
            <span class="ctrl-label">End label</span>
            <input type="text" id="txt-end-label" value="End">
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">End marker</span>
            <select id="sel-end-marker">
                <option value="none">None (short out and back)</option>
                <option value="end" selected>Track end (linear)</option>
                <option value="farthest">Farthest point (long out and back)</option>
            </select>
        </div>
        <button id="btn-advanced">&#9662; Advanced settings</button>
        <div id="advanced-settings">
            <div class="adv-section-title">Tracks</div>
            <div class="ctrl-row">
                <label><input type="checkbox" id="chk-tracks" checked> Show tracks</label>
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Offset</span>
                <input type="range" id="sld-track-offset" min="0" max="1" value="0.05" step="0.01" style="flex:1">
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Width</span>
                <input type="range" id="sld-track-width" min="1" max="10" value="3" step="0.5" style="flex:1">
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Track color</span>
                <input type="color" id="clr-track" value="#ff3333">
                <span class="ctrl-label">Highlight</span>
                <input type="color" id="clr-highlight" value="#ffee00">
            </div>
            <hr class="adv-divider">
            <div class="adv-section-title">Scene</div>
            <div class="ctrl-row">
                <label><input type="checkbox" id="chk-wireframe"> Wireframe</label>
                <label><input type="checkbox" id="chk-texture" checked> Texture</label>
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Background</span>
                <input type="color" id="clr-background" value="#87ceeb">
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Fog</span>
                <input type="range" id="sld-fog" min="0" max="1" value="0" step="0.01" style="flex:1">
            </div>
            <hr class="adv-divider">
            <div class="adv-section-title">Labels</div>
            <div class="ctrl-row">
                <label><input type="checkbox" id="chk-labels" checked> Show labels</label>
                <span class="ctrl-label">Size</span>
                <input type="range" id="sld-label-size" min="6" max="20" value="16.5" step="0.5" style="flex:1">
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Offset</span>
                <input type="range" id="sld-label-offset" min="0" max="3" value="0.8" step="0.1" style="flex:1">
            </div>
            <div class="ctrl-row">
                <button id="btn-load-labels" class="ctrl-btn">Load labels CSV</button>
                <input type="file" id="input-labels-csv" accept=".csv" style="display:none">
                <span id="labels-count" class="ctrl-label"></span>
            </div>
            <hr class="adv-divider">
            <div class="adv-section-title">Camera</div>
            <div class="ctrl-row">
                <span class="ctrl-label">Azimuth</span>
                <input type="range" id="sld-theta" min="-3.1416" max="3.1416" value="0" step="0.01" style="flex:1">
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Elevation</span>
                <input type="range" id="sld-phi" min="0.1" max="2.67" value="1" step="0.01" style="flex:1">
            </div>
            <hr class="adv-divider">
            <div class="ctrl-row">
                <button id="btn-export" class="ctrl-btn">Export scene data</button>
            </div>
        </div>
    </div>



    <script src="gpx-utils.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const SAT_TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile';
    const TERR_TILE_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium';
    const TILE_PX = 256;

    // DOM
    const $landing   = document.getElementById('landing');
    const $progress  = document.getElementById('progress');
    const $pStep     = document.getElementById('progress-step');
    const $pFill     = document.getElementById('progress-fill');
    const $pPct      = document.getElementById('progress-pct');
    const $pDetail   = document.getElementById('progress-detail');
    const $viewer    = document.getElementById('viewer');
    const $fileInput = document.getElementById('file-input');
    const $dropzone  = document.getElementById('dropzone');
    const $setGrid   = document.getElementById('set-grid');
    const $setGridV  = document.getElementById('set-grid-v');
    const $setTex    = document.getElementById('set-tex');
    const $setTexV   = document.getElementById('set-tex-v');
    const $setTiles  = document.getElementById('set-tiles');
    const $setTilesV = document.getElementById('set-tiles-v');
    const $setPad    = document.getElementById('set-pad');
    const $setPadV   = document.getElementById('set-pad-v');
    $setGrid.oninput = () => $setGridV.textContent = $setGrid.value;
    $setTex.oninput  = () => $setTexV.textContent = $setTex.value;
    $setTiles.oninput = () => $setTilesV.textContent = `${$setTiles.value}×${$setTiles.value}`;
    $setPad.oninput  = () => $setPadV.textContent = $setPad.value + '%';

    function prog(step, pct, detail = '') {
        $pStep.textContent = step;
        $pFill.style.width = pct + '%';
        $pPct.textContent = Math.round(pct) + '%';
        $pDetail.textContent = detail;
    }

    // ── GPX Parser ──────────────────────────────────────────────

    function computeTrackStats(points) {
        let dist = 0, elevGain = 0, elapsedSec = 0;
        let date = null;
        if (points[0]?.time) date = points[0].time;
        for (let i = 1; i < points.length; i++) {
            dist += haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
            if (points[i].ele != null && points[i - 1].ele != null) {
                const diff = points[i].ele - points[i - 1].ele;
                if (diff > 0) elevGain += diff;
            }
        }
        if (points[0]?.time && points[points.length - 1]?.time) {
            elapsedSec = (points[points.length - 1].time - points[0].time) / 1000;
        }
        return { dist, elevGain, elapsedSec, date };
    }

    // ── Bounding Box ────────────────────────────────────────────

    function bbox(pts, pad) {
        let minLa = Infinity, maxLa = -Infinity, minLo = Infinity, maxLo = -Infinity;
        for (const p of pts) {
            if (p.lat < minLa) minLa = p.lat;
            if (p.lat > maxLa) maxLa = p.lat;
            if (p.lon < minLo) minLo = p.lon;
            if (p.lon > maxLo) maxLo = p.lon;
        }
        const cLat = (minLa + maxLa) / 2, cLon = (minLo + maxLo) / 2;
        const latM = (maxLa - minLa) * 110540;
        const lonM = (maxLo - minLo) * 111320 * Math.cos(cLat * Math.PI / 180);
        const halfM = Math.max(latM, lonM) / 2 * (1 + pad);
        const halfLat = halfM / 110540;
        const halfLon = halfM / (111320 * Math.cos(cLat * Math.PI / 180));
        return { minLat: cLat - halfLat, maxLat: cLat + halfLat, minLon: cLon - halfLon, maxLon: cLon + halfLon };
    }

    // ── Elevation (AWS Terrain Tiles – Terrarium format) ───────

    const lon2t = (lo, z) => Math.floor((lo + 180) / 360 * (1 << z));
    const lat2t = (la, z) => { const r = la * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * (1 << z)); };

    function loadTileImage(url) {
        return new Promise((res, rej) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => res(img);
            img.onerror = () => rej(new Error('Failed to load tile: ' + url));
            img.src = url;
        });
    }

    async function fetchElevations(bb, gw, gh, onProg) {
        const mid = (bb.maxLat + bb.minLat) / 2;
        const mw = (bb.maxLon - bb.minLon) * 111320 * Math.cos(mid * Math.PI / 180);
        let z = Math.round(Math.log2(156543 * Math.cos(mid * Math.PI / 180) / (mw / (gw * 1.5))));
        z = Math.max(8, Math.min(z, 14));

        const tx0 = lon2t(bb.minLon, z), tx1 = lon2t(bb.maxLon, z);
        const ty0 = lat2t(bb.maxLat, z), ty1 = lat2t(bb.minLat, z);
        const tw = tx1 - tx0 + 1, th = ty1 - ty0 + 1;
        const total = tw * th;

        const cv = document.createElement('canvas');
        cv.width = tw * TILE_PX; cv.height = th * TILE_PX;
        const cx = cv.getContext('2d', { willReadFrequently: true });

        let loaded = 0;
        const proms = [];
        for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
                proms.push(
                    loadTileImage(`${TERR_TILE_URL}/${z}/${tx}/${ty}.png`)
                        .then(img => { cx.drawImage(img, (tx - tx0) * TILE_PX, (ty - ty0) * TILE_PX); })
                        .catch(() => {})
                        .finally(() => { loaded++; onProg(loaded, total); })
                );
            }
        }
        await Promise.all(proms);

        const nn = 1 << z;
        const lo2px = lo => ((lo + 180) / 360 * nn - tx0) * TILE_PX;
        const la2px = la => { const r = la * Math.PI / 180; return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * nn - ty0) * TILE_PX; };

        const imgData = cx.getImageData(0, 0, cv.width, cv.height).data;
        const stride = cv.width * 4;
        const elev = new Float64Array(gw * gh);
        for (let r = 0; r < gh; r++) {
            const lat = bb.maxLat - (r / (gh - 1)) * (bb.maxLat - bb.minLat);
            const py = la2px(lat);
            const iy = Math.max(0, Math.min(Math.round(py), cv.height - 1));
            for (let c = 0; c < gw; c++) {
                const lon = bb.minLon + (c / (gw - 1)) * (bb.maxLon - bb.minLon);
                const px = lo2px(lon);
                const ix = Math.max(0, Math.min(Math.round(px), cv.width - 1));
                const off = iy * stride + ix * 4;
                elev[r * gw + c] = (imgData[off] * 256 + imgData[off+1] + imgData[off+2] / 256) - 32768;
            }
        }
        return elev;
    }

    // ── Satellite Tiles ─────────────────────────────────────────

    // Grid row/column where texture tile i of n starts; neighbouring tiles share the edge row/column
    const tileEdge = (i, n, size) => Math.round(i * (size - 1) / n);

    async function fetchTexture(bb, texRes, n, gw, gh, onProg) {
        const mid = (bb.maxLat + bb.minLat) / 2;
        const mw = (bb.maxLon - bb.minLon) * 111320 * Math.cos(mid * Math.PI / 180);
        let z = Math.round(Math.log2(156543 * Math.cos(mid * Math.PI / 180) / (mw / (texRes * n))));
        z = Math.max(10, Math.min(z, 19));

        const tx0 = lon2t(bb.minLon, z), tx1 = lon2t(bb.maxLon, z);
        const ty0 = lat2t(bb.maxLat, z), ty1 = lat2t(bb.minLat, z);
        const tw = tx1 - tx0 + 1, th = ty1 - ty0 + 1, total = tw * th;

        const nn = 1 << z;
        const lo2px = lo => ((lo + 180) / 360 * nn - tx0) * TILE_PX;
        const la2px = la => { const r = la * Math.PI / 180; return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * nn - ty0) * TILE_PX; };

        // Each texture tile is a canvas aligned to whole map pixels, slightly larger than its share
        // of the terrain, so map tiles are drawn unscaled and edge texels hold real imagery.
        // offset/repeat then map exactly that share onto the terrain chunk's UVs.
        const texTiles = [];
        for (let i = 0; i < n; i++) {
            const latTop = bb.maxLat - tileEdge(i, n, gh) / (gh - 1) * (bb.maxLat - bb.minLat);
            const latBot = bb.maxLat - tileEdge(i + 1, n, gh) / (gh - 1) * (bb.maxLat - bb.minLat);
            for (let j = 0; j < n; j++) {
                const lonL = bb.minLon + tileEdge(j, n, gw) / (gw - 1) * (bb.maxLon - bb.minLon);
                const lonR = bb.minLon + tileEdge(j + 1, n, gw) / (gw - 1) * (bb.maxLon - bb.minLon);
                const sx = lo2px(lonL), ex = lo2px(lonR), sy = la2px(latTop), ey = la2px(latBot);
                const ox = Math.floor(sx), oy = Math.floor(sy);
                const canvas = document.createElement('canvas');
                canvas.width = Math.ceil(ex) - ox; canvas.height = Math.ceil(ey) - oy;
                const w = canvas.width, h = canvas.height;
                texTiles.push({
                    canvas, ctx: canvas.getContext('2d'), ox, oy,
                    offset: [(sx - ox) / w, 1 - (ey - oy) / h],
                    repeat: [(ex - sx) / w, (ey - sy) / h],
                });
            }
        }

        let loaded = 0;
        const proms = [];
        for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
                const px = (tx - tx0) * TILE_PX, py = (ty - ty0) * TILE_PX;
                proms.push(
                    loadTileImage(`${SAT_TILE_URL}/${z}/${ty}/${tx}`)
                        .then(img => {
                            for (const t of texTiles) {
                                if (px < t.ox + t.canvas.width && px + TILE_PX > t.ox &&
                                    py < t.oy + t.canvas.height && py + TILE_PX > t.oy)
                                    t.ctx.drawImage(img, px - t.ox, py - t.oy);
                            }
                        })
                        .catch(() => {})
                        .finally(() => { loaded++; onProg(loaded, total); })
                );
            }
        }
        await Promise.all(proms);

        return texTiles.map(({ canvas, offset, repeat }) => ({ canvas, offset, repeat }));
    }

    // ── Interpolation ───────────────────────────────────────────

    function interpElev(lat, lon, bb, elev, gw, gh) {
        const fr = (bb.maxLat - lat) / (bb.maxLat - bb.minLat) * (gh - 1);
        const fc = (lon - bb.minLon) / (bb.maxLon - bb.minLon) * (gw - 1);
        const r0 = Math.max(0, Math.min(Math.floor(fr), gh - 2));
        const c0 = Math.max(0, Math.min(Math.floor(fc), gw - 2));
        const dr = fr - r0, dc = fc - c0;
        return elev[r0*gw+c0]*(1-dr)*(1-dc) + elev[r0*gw+c0+1]*(1-dr)*dc +
               elev[(r0+1)*gw+c0]*dr*(1-dc) + elev[(r0+1)*gw+c0+1]*dr*dc;
    }

    // ── 3D Scene ────────────────────────────────────────────────

    function parseLabelsCSV(text) {
        const lines = text.trim().split('\n');
        const headers = lines[0].split(',').map(h => h.trim());
        return lines.slice(1).filter(l => l.trim()).map(line => {
            const cols = line.split(',').map(c => c.trim());
            const obj = {};
            for (let i = 0; i < headers.length; i++) obj[headers[i]] = cols[i] ?? '';
            return { name: obj.name, lat: +obj.lat, lon: +obj.lon, offset: obj.offset ? +obj.offset : 0 };
        });
    }

    function addLabelsToScene(labels) {
        if (!scene || !S || !D) return;
        const toRemove = [];
        scene.traverse(o => { if (o.name === 'label') toRemove.push(o); });
        toRemove.forEach(o => { o.removeFromParent(); if (o.element) o.element.remove(); });
        const baseOffset = +document.getElementById('sld-label-offset').value;
        const fontSize = document.getElementById('sld-label-size').value + 'px';
        const visible = document.getElementById('chk-labels').checked;
        for (const lb of labels) {
            if (lb.lat < D.bb.minLat || lb.lat > D.bb.maxLat || lb.lon < D.bb.minLon || lb.lon > D.bb.maxLon) continue;
            const x = ((lb.lon - D.bb.minLon) / (D.bb.maxLon - D.bb.minLon) - 0.5) * S.sw;
            const z = ((D.bb.maxLat - lb.lat) / (D.bb.maxLat - D.bb.minLat) - 0.5) * S.sd;
            const e = interpElev(lb.lat, lb.lon, D.bb, D.elev, D.gw, D.gh);
            const baseY = (e - S.meanE) * S.scale;
            const extraOffset = lb.offset ?? 0;
            const div = document.createElement('div');
            div.textContent = lb.name;
            div.style.cssText = `color:#fff;font-size:${fontSize};padding:2px 6px;background:rgba(0,0,0,0.55);border-radius:4px;white-space:nowrap;`;
            const label = new CSS2DObject(div);
            label.position.set(x, baseY + baseOffset + extraOffset, z);
            label.name = 'label';
            label.visible = visible;
            label.userData.baseY = baseY;
            label.userData.extraOffset = extraOffset;
            scene.add(label);
        }
    }

    let renderer, labelRenderer, scene, camera, controls;
    let terrainChunks = [];
    let S = null;
    let D = null;
    let trackMidpoints = [];
    let trackHeads = [];
    let trackFarthest = [];
    let trackFarthestIdx = [];
    let trackCumStats = [];
    let origTarget = null;
    let animId = null;
    let cachedTerrainData = null;
    const HIGHLIGHT_LIFT = 0.02;

    function setTerrainY(geom, elev, meanE, scale) {
        const pos = geom.attributes.position;
        for (let i = 0; i < pos.count; i++) pos.setY(i, (elev[i] - meanE) * scale);
        pos.needsUpdate = true;
        geom.computeVertexNormals();
    }

    function addTrackLine(pts, bb, elev, gw, gh, scale, meanE, sw, sd, color, idx) {
        const arr = [];
        for (const p of pts) {
            const x = ((p.lon - bb.minLon) / (bb.maxLon - bb.minLon) - 0.5) * sw;
            const z = ((bb.maxLat - p.lat) / (bb.maxLat - bb.minLat) - 0.5) * sd;
            const e = interpElev(p.lat, p.lon, bb, elev, gw, gh);
            arr.push(x, (e - meanE) * scale, z);
        }
        const geom = new LineGeometry();
        geom.setPositions(arr);
        const mat = new LineMaterial({ color, linewidth: +document.getElementById('sld-track-width').value, resolution: new THREE.Vector2(innerWidth, innerHeight) });
        const line = new Line2(geom, mat);
        line.name = 'gpx-track';
        line.userData.trackIdx = idx;
        line.userData.totalSegments = pts.length - 1;
        line.userData.positions = arr;
        line.position.y = +document.getElementById('sld-track-offset').value;
        scene.add(line);
    }

    function makeEarthTexture(w, h) {
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const cx = cv.getContext('2d');
        const img = cx.createImageData(w, h);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
            const t = Math.random();
            const r = 40 + t * 70 | 0;
            const g = 25 + t * 40 | 0;
            const b = 10 + t * 20 | 0;
            d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
        }
        cx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(cv);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
    }

    function buildBox(elev, gw, gh, sw, sd, meanE, scale, minE) {
        const bottomY = (minE - 200 - meanE) * scale;
        const earthTex = makeEarthTexture(512, 512);
        const brownMat = new THREE.MeshStandardMaterial({
            map: earthTex, roughness: 0.95, metalness: 0
        });

        function makeSide(count, getTopVertex, flip) {
            const positions = [];
            const uvs = [];
            const indices = [];
            for (let i = 0; i < count; i++) {
                const [x, y, z] = getTopVertex(i);
                const u = i / (count - 1);
                positions.push(x, y, z);
                uvs.push(u, 1);
                positions.push(x, bottomY, z);
                uvs.push(u, 0);
            }
            for (let i = 0; i < count - 1; i++) {
                const t0 = i * 2, b0 = i * 2 + 1, t1 = (i + 1) * 2, b1 = (i + 1) * 2 + 1;
                if (flip) {
                    indices.push(b0, t1, t0);
                    indices.push(b0, b1, t1);
                } else {
                    indices.push(b0, t0, t1);
                    indices.push(b0, t1, b1);
                }
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geom.setIndex(indices);
            geom.computeVertexNormals();
            return new THREE.Mesh(geom, brownMat);
        }

        scene.add(makeSide(gw, c => [
            (c / (gw - 1) - 0.5) * sw,
            (elev[c] - meanE) * scale,
            -sd / 2
        ], false));

        scene.add(makeSide(gw, c => [
            (c / (gw - 1) - 0.5) * sw,
            (elev[(gh - 1) * gw + c] - meanE) * scale,
            sd / 2
        ], true));

        scene.add(makeSide(gh, r => [
            -sw / 2,
            (elev[r * gw] - meanE) * scale,
            (r / (gh - 1) - 0.5) * sd
        ], true));

        scene.add(makeSide(gh, r => [
            sw / 2,
            (elev[r * gw + gw - 1] - meanE) * scale,
            (r / (gh - 1) - 0.5) * sd
        ], false));

        const bGeom = new THREE.PlaneGeometry(sw, sd);
        bGeom.rotateX(Math.PI / 2);
        bGeom.translate(0, bottomY, 0);
        scene.add(new THREE.Mesh(bGeom, brownMat));
    }

    function buildScene(elev, texTiles, tracks, bb, gw, gh) {
        const mid = (bb.maxLat + bb.minLat) / 2;
        const wm = (bb.maxLon - bb.minLon) * 111320 * Math.cos(mid * Math.PI / 180);
        const dm = (bb.maxLat - bb.minLat) * 110540;
        const mx = Math.max(wm, dm);
        const scale = 100 / mx;
        const sw = wm * scale, sd = dm * scale;

        let minE = Infinity, maxE = -Infinity, sum = 0;
        for (let i = 0; i < elev.length; i++) {
            if (elev[i] < minE) minE = elev[i];
            if (elev[i] > maxE) maxE = elev[i];
            sum += elev[i];
        }
        const meanE = sum / elev.length;

        S = { scale, meanE, sw, sd };
        D = { elev, bb, gw, gh };

        const toScene = (lat, lon) => {
            const x = ((lon - bb.minLon) / (bb.maxLon - bb.minLon) - 0.5) * sw;
            const z = ((bb.maxLat - lat) / (bb.maxLat - bb.minLat) - 0.5) * sd;
            const e = interpElev(lat, lon, bb, elev, gw, gh);
            return new THREE.Vector3(x, (e - meanE) * scale, z);
        };
        trackMidpoints = tracks.map(pts => {
            let mLa = 0, mLo = 0;
            for (const p of pts) { mLa += p.lat; mLo += p.lon; }
            return toScene(mLa / pts.length, mLo / pts.length);
        });
        trackHeads = tracks.map(pts => toScene(pts[0].lat, pts[0].lon));
        trackFarthestIdx = tracks.map(pts => {
            let far = 0, farDist = 0;
            for (let k = 0; k < pts.length; k++) {
                const d = haversine(pts[0].lat, pts[0].lon, pts[k].lat, pts[k].lon);
                if (d > farDist) { far = k; farDist = d; }
            }
            return far;
        });
        trackFarthest = tracks.map((pts, i) => toScene(pts[trackFarthestIdx[i]].lat, pts[trackFarthestIdx[i]].lon));
        // Cumulative distance and ascent at each track point, measured like computeTrackStats
        trackCumStats = tracks.map(pts => {
            const dist = new Float64Array(pts.length), gain = new Float64Array(pts.length);
            for (let k = 1; k < pts.length; k++) {
                dist[k] = dist[k-1] + haversine(pts[k-1].lat, pts[k-1].lon, pts[k].lat, pts[k].lon);
                const up = pts[k].ele != null && pts[k-1].ele != null ? pts[k].ele - pts[k-1].ele : 0;
                gain[k] = gain[k-1] + Math.max(up, 0);
            }
            return { dist, gain };
        });

        scene = new THREE.Scene();
        scene.background = new THREE.Color(document.getElementById('clr-background').value);

        camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(sw * 0.6, (maxE - meanE) * scale + 25, sd * 0.6);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        $viewer.innerHTML = '';
        $viewer.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, (maxE - meanE) * scale * -0.1, 0);
        origTarget = controls.target.clone();
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const dl = new THREE.DirectionalLight(0xffffff, 0.8);
        dl.position.set(50, 80, 30);
        scene.add(dl);

        const geom = new THREE.PlaneGeometry(sw, sd, gw - 1, gh - 1);
        geom.rotateX(-Math.PI / 2);
        setTerrainY(geom, elev, meanE, scale);

        // One terrain chunk per texture tile. Positions and normals are copied from the full mesh
        // so vertices on shared chunk edges match exactly and shading shows no seams.
        const n = Math.round(Math.sqrt(texTiles.length));
        const fullPos = geom.attributes.position, fullNorm = geom.attributes.normal;
        terrainChunks = texTiles.map((tile, k) => {
            const r0 = tileEdge(Math.floor(k / n), n, gh), r1 = tileEdge(Math.floor(k / n) + 1, n, gh);
            const c0 = tileEdge(k % n, n, gw), c1 = tileEdge(k % n + 1, n, gw);
            const cGeom = new THREE.PlaneGeometry(1, 1, c1 - c0, r1 - r0);
            const pos = cGeom.attributes.position, norm = cGeom.attributes.normal;
            for (let r = r0; r <= r1; r++) {
                for (let c = c0; c <= c1; c++) {
                    const i = (r - r0) * (c1 - c0 + 1) + (c - c0), j = r * gw + c;
                    pos.setXYZ(i, fullPos.getX(j), fullPos.getY(j), fullPos.getZ(j));
                    norm.setXYZ(i, fullNorm.getX(j), fullNorm.getY(j), fullNorm.getZ(j));
                }
            }

            const tex = new THREE.CanvasTexture(tile.canvas);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.offset.set(...tile.offset);
            tex.repeat.set(...tile.repeat);

            const chunk = new THREE.Mesh(cGeom, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0 }));
            chunk.userData.tex = tex;
            scene.add(chunk);
            return chunk;
        });
        geom.dispose();

        buildBox(elev, gw, gh, sw, sd, meanE, scale, minE);

        tracks.forEach((pts, i) => addTrackLine(pts, bb, elev, gw, gh, scale, meanE, sw, sd, document.getElementById('clr-track').value, i));

        labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(innerWidth, innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        labelRenderer.domElement.style.zIndex = '5';
        $viewer.appendChild(labelRenderer.domElement);

        addLabelsToScene([]);

        const $sldTheta = document.getElementById('sld-theta');
        const $sldPhi = document.getElementById('sld-phi');

        function animate(now) {
            animId = requestAnimationFrame(animate);
            if (movePlaying) {
                const delta = (now - lastFrameTime) / 1000;
                lastFrameTime = now;
                if (delta > 0 && delta < 0.5) {
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    dir.y = 0;
                    dir.normalize();
                    dir.applyAxisAngle(camera.up, MOVE_ANGLES[cameraMode]);
                    const speed = +$rotSpd.value * 2;
                    const move = dir.multiplyScalar(speed * delta);
                    camera.position.add(move);
                    controls.target.add(move);
                }
            }
            const animDuration = +document.getElementById('sld-animate-dur').value * 1000;
            if (trackAnimating && now - trackAnimStart >= animPhases(animDuration).total) stopTrackAnimation();
            if (trackAnimating) updateTrackAnimation(now - trackAnimStart, animDuration);
            controls.update();
            const sph = new THREE.Spherical().setFromVector3(
                camera.position.clone().sub(controls.target)
            );
            $sldTheta.value = sph.theta;
            $sldPhi.value = sph.phi;
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        const onResize = () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            labelRenderer.setSize(innerWidth, innerHeight);
            scene.traverse(o => { if (o.name === 'gpx-track') o.material.resolution.set(innerWidth, innerHeight); });
        };
        window.addEventListener('resize', onResize);
        renderer._onResize = onResize;
    }


    // Track names look like "D07 Gokyo to Gokyo Ri [farthest]": an optional day prefix, then "A to B" or just "A",
    // and an optional [farthest] tag. They prefill the start/end marker labels and the end marker mode.
    let trackLabels = [];

    function parseTrackName(raw) {
        const tag = /\s*\[farthest\]\s*$/i;
        const farthest = tag.test(raw);
        const day = (raw.match(/^(D\d+)\s/) || [])[1] || '';
        const display = raw.replace(/^D\d+\s+/, '').replace(tag, '');
        const parts = display.split(' to ');
        if (parts.length < 2) return { display, day, start: display, end: '', endMode: 'none' };
        return { display, day, start: parts[0], end: parts.slice(1).join(' to '), endMode: farthest ? 'farthest' : 'end' };
    }

    function showViewer(tracks, trackNames) {
        $progress.classList.remove('active');
        $viewer.classList.add('active');
        document.getElementById('rotate-box').classList.add('active');

        trackLabels = trackNames.map(parseTrackName);
        const displayNames = trackLabels.map(l => l.display);

        const $sel = document.getElementById('sel-highlight');
        $sel.innerHTML = '<option value="">-- none --</option>';
        displayNames.forEach((n, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = n;
            $sel.appendChild(opt);
        });

        if (!tracks.length) return;

        const perTrack = tracks.map((pts, i) => ({ name: displayNames[i], ...computeTrackStats(pts) }));
        const totalDist = perTrack.reduce((s, t) => s + t.dist, 0);
        const totalGain = perTrack.reduce((s, t) => s + t.elevGain, 0);
        const totalTime = perTrack.reduce((s, t) => s + t.elapsedSec, 0);
        const $stats = document.getElementById('stats-box');

        if (tracks.length === 1) {
            const t = perTrack[0];
            $stats.innerHTML = `
                <div class="stat-title">${t.name}</div>
                <div class="stat-row"><span class="stat-label">Date</span><span class="stat-value">${formatDate(t.date)}</span></div>
                <div class="stat-row"><span class="stat-label">Distance</span><span class="stat-value">${(t.dist / 1000).toFixed(2)} km</span></div>
                <div class="stat-row"><span class="stat-label">Elevation gain</span><span class="stat-value">${Math.round(t.elevGain)} m</span></div>
                <div class="stat-row"><span class="stat-label">Time</span><span class="stat-value">${formatDuration(t.elapsedSec)}</span></div>`;
        } else {
            let tableHTML = `<table id="stats-table"><thead><tr>
                <th>Name</th><th>Date</th><th>Distance</th><th>Gain</th><th>Time</th>
                </tr></thead><tbody>`;
            for (const t of perTrack) {
                tableHTML += `<tr>
                    <td>${t.name}</td>
                    <td>${formatDate(t.date)}</td>
                    <td>${(t.dist / 1000).toFixed(2)} km</td>
                    <td>${Math.round(t.elevGain)} m</td>
                    <td>${formatDuration(t.elapsedSec)}</td></tr>`;
            }
            tableHTML += '</tbody></table>';
            $stats.innerHTML = `
                <div class="stat-title">${tracks.length} Activities</div>
                <div class="stat-row"><span class="stat-label">Total distance</span><span class="stat-value">${(totalDist / 1000).toFixed(2)} km</span></div>
                <div class="stat-row"><span class="stat-label">Total elevation</span><span class="stat-value">${Math.round(totalGain)} m</span></div>
                <div class="stat-row"><span class="stat-label">Total time</span><span class="stat-value">${formatDuration(totalTime)}</span></div>
                <button id="btn-details">&#9662; Details</button>
                <div id="stats-details" style="display:none;overflow-x:auto">${tableHTML}</div>`;
            document.getElementById('btn-details').addEventListener('click', () => {
                const det = document.getElementById('stats-details');
                const btn = document.getElementById('btn-details');
                const open = det.style.display !== 'none';
                det.style.display = open ? 'none' : 'block';
                btn.innerHTML = open ? '&#9662; Details' : '&#9652; Details';
                $stats.classList.toggle('expanded', !open);
            });
        }
    }

    // ── Main Flow ───────────────────────────────────────────────

    async function processFiles(files) {
        $landing.style.display = 'none';
        $progress.classList.add('active');

        const gridSize = +$setGrid.value;
        const texRes = +$setTex.value;
        const texTileCount = +$setTiles.value;
        const padding = +$setPad.value / 100;

        try {
            prog('Step 1/4 — Parsing GPX files...', 2);
            const sorted = Array.from(files).sort((a, b) => a.name.localeCompare(b.name));
            const tracks = [];
            const trackNames = [];
            const allPoints = [];
            for (const file of sorted) {
                const text = await file.text();
                const { points, name } = parseGPXPoints(text);
                if (points.length) {
                    const smoothed = smoothPoints(points, 5);
                    tracks.push(smoothed);
                    trackNames.push(name);
                    allPoints.push(...smoothed);
                }
            }
            if (!allPoints.length) throw new Error('No track points found in GPX files');
            prog('Step 1/4 — Parsing GPX files...', 5, `${sorted.length} files, ${allPoints.length} total points`);

            const bb = bbox(allPoints, padding);
            const gw = gridSize, gh = gridSize;

            prog('Step 2/4 — Fetching elevation data...', 6, `Grid ${gw}×${gh} = ${(gw*gh).toLocaleString()} points`);
            const elev = await fetchElevations(bb, gw, gh, (d, t) => {
                prog('Step 2/4 — Fetching elevation data...', 6 + (d / t) * 59, `Terrain tile ${d} / ${t}`);
            });

            prog('Step 3/4 — Loading satellite imagery...', 66);
            const texTiles = await fetchTexture(bb, texRes, texTileCount, gw, gh, (d, t) => {
                prog('Step 3/4 — Loading satellite imagery...', 66 + (d / t) * 27, `Tile ${d} / ${t}`);
            });

            cachedTerrainData = { elev, texTiles, bb, gw, gh, tracks, trackNames };

            prog('Step 4/4 — Building 3D scene...', 95);
            await new Promise(r => setTimeout(r, 80));
            buildScene(elev, texTiles, tracks, bb, gw, gh);

            prog('Done!', 100);
            await new Promise(r => setTimeout(r, 350));

            showViewer(tracks, trackNames);
        } catch (err) {
            prog('Error', 0, err.message);
            console.error(err);
        }
    }

    // ── Camera modes ────────────────────────────────────────────

    const $rotBox  = document.getElementById('rotate-box');
    const $rotSpd  = document.getElementById('rot-speed');
    const $selCameraMode = document.getElementById('sel-camera-mode');

    // Rotation of the ground-projected view direction around the up axis, per move mode
    const MOVE_ANGLES = { forward: 0, left: Math.PI / 2, backward: Math.PI, right: -Math.PI / 2 };

    let cameraMode = 'orbit-left';
    let movePlaying = false;
    let lastFrameTime = 0;

    // A positive OrbitControls autoRotateSpeed swings the camera to its left around the target
    const orbitSpeed = () => +$rotSpd.value * (cameraMode === 'orbit-right' ? -1 : 1);

    // Camera motion runs only while the track animation plays
    function startCameraMotion() {
        if (!controls) return;
        if (cameraMode.startsWith('orbit')) {
            controls.autoRotateSpeed = orbitSpeed();
            controls.autoRotate = true;
        } else {
            movePlaying = true;
            lastFrameTime = performance.now();
        }
    }

    function stopAllCameraMotion() {
        if (controls) controls.autoRotate = false;
        movePlaying = false;
    }

    $selCameraMode.addEventListener('change', e => {
        stopAllCameraMotion();
        cameraMode = e.target.value;
        if (trackAnimating) startCameraMotion();
    });

    document.getElementById('btn-advanced').addEventListener('click', () => {
        const panel = document.getElementById('advanced-settings');
        const btn = document.getElementById('btn-advanced');
        panel.classList.toggle('open');
        btn.innerHTML = panel.classList.contains('open') ? '&#9652; Advanced settings' : '&#9662; Advanced settings';
    });

    $rotSpd.addEventListener('input', () => {
        if (controls) controls.autoRotateSpeed = orbitSpeed();
    });

    function setCameraFromSliders() {
        if (!controls) return;
        const sph = new THREE.Spherical().setFromVector3(
            camera.position.clone().sub(controls.target)
        );
        sph.theta = +document.getElementById('sld-theta').value;
        sph.phi = +document.getElementById('sld-phi').value;
        camera.position.copy(new THREE.Vector3().setFromSpherical(sph).add(controls.target));
    }
    document.getElementById('sld-theta').addEventListener('input', setCameraFromSliders);
    document.getElementById('sld-phi').addEventListener('input', setCameraFromSliders);

    document.getElementById('clr-background').addEventListener('input', e => {
        if (!scene) return;
        scene.background = new THREE.Color(e.target.value);
        if (scene.fog) scene.fog.color.set(e.target.value);
    });

    document.getElementById('sld-fog').addEventListener('input', e => {
        if (!scene) return;
        const v = +e.target.value;
        if (v === 0) {
            scene.fog = null;
        } else {
            const bg = document.getElementById('clr-background').value;
            scene.fog = new THREE.FogExp2(bg, v * 0.02);
        }
    });

    document.getElementById('chk-labels').addEventListener('change', e => {
        if (!scene) return;

    });

    document.getElementById('sld-label-size').addEventListener('input', e => {

    });

    document.getElementById('sld-label-offset').addEventListener('input', e => {
        if (!scene) return;

    const $btnLoadLabels = document.getElementById('btn-load-labels');

    document.getElementById('chk-wireframe').addEventListener('change', e => {

    document.getElementById('chk-texture').addEventListener('change', e => {

    document.getElementById('chk-tracks').addEventListener('change', e => {

    const $btnCenter = document.getElementById('btn-center');
    const $btnHead = document.getElementById('btn-head');

        if (!scene) return;
        const idx = e.target.value;

        $btnHead.disabled = idx === '';
        $btnAnimate.disabled = idx === '';

    $btnCenter.addEventListener('click', () => {

    $btnHead.addEventListener('click', () => {
        if (!controls) return;
        const idx = document.getElementById('sel-highlight').value;
        if (idx === '' || !trackHeads[+idx]) return;
        const head = trackHeads[+idx], far = trackFarthest[+idx];
        const sph = new THREE.Spherical().setFromVector3(
            camera.position.clone().sub(controls.target)
        );
        // Place the camera behind the head so the view runs through it toward the farthest point
        if (far.x !== head.x || far.z !== head.z) sph.theta = Math.atan2(head.x - far.x, head.z - far.z);
        controls.target.copy(head);
        camera.position.copy(new THREE.Vector3().setFromSpherical(sph).add(head));
    });

    document.getElementById('btn-recenter').addEventListener('click', () => {
        if (!controls || !origTarget) return;
        controls.target.copy(origTarget);
    });

    // ── Track animation ─────────────────────────────────────────

    // Timeline: camera-only lead-in → stats box fades in → start marker → pulse (slider duration) → end marker
    // → camera-only tail. With the end marker at the farthest point, the pulse instead holds there while the
    // marker appears. The camera keeps moving and the stats box stays up until the very end.
    const ANIM_LEAD_MS = 2000;
    const STATS_FADE_MS = 500;
    const MARKER_MS = 500;
    const ANIM_TAIL_MS = 2000;
    let trackAnimating = false;
    let trackAnimStart = 0;
    let animTrack = null;
    let animEndMode = 'end';
    let controlsWereVisible = false;
    let animFarFrac = 0;  // Fraction of the track's length at which the farthest point lies
    const $btnAnimate = document.getElementById('btn-animate');

    // ── Pulse ──
    // Recolors the animated track itself: highlight color at the current point, fading to the track
    // color PULSE_RADIUS_M before and after it. Those points are also raised (up to PULSE_LIFT at the
    // current point) so the pulse stays on top where an out-and-back track overlaps itself.
    const PULSE_RADIUS_M = 1000;
    const PULSE_LIFT = 0.005;
    let pulseCum = null;
    let pulseRange = null;  // [first, last] track point currently recolored and raised

    // Track point k is the end of segment k-1 and the start of segment k in Line2's interleaved buffers
    function setTrackPoint(k, xyz, rgb) {
        const g = animTrack.geometry, last = pulseCum.length - 1;
        const pos = g.attributes.instanceStart.data.array, col = g.attributes.instanceColorStart.data.array;
        if (k > 0) { pos.set(xyz, (k - 1) * 6 + 3); col.set(rgb, (k - 1) * 6 + 3); }
        if (k < last) { pos.set(xyz, k * 6); col.set(rgb, k * 6); }
    }

    function startPulse() {
        const p = animTrack.userData.positions, n = p.length / 3;
        pulseCum = new Float64Array(n);
        for (let k = 1; k < n; k++) {
            const dx = p[k*3] - p[k*3-3], dy = p[k*3+1] - p[k*3-2], dz = p[k*3+2] - p[k*3-1];
            pulseCum[k] = pulseCum[k-1] + Math.hypot(dx, dy, dz) / S.scale;
        }
        pulseRange = null;

        const g = animTrack.geometry;
        if (!g.attributes.instanceColorStart) g.setColors(new Float32Array(n * 3));
        const base = new THREE.Color(document.getElementById('clr-track').value);
        const col = g.attributes.instanceColorStart.data;
        for (let i = 0; i < col.array.length; i += 3) col.array.set([base.r, base.g, base.b], i);
        col.needsUpdate = true;
        animTrack.material.vertexColors = true;
        animTrack.material.needsUpdate = true;
    }

    function updatePulse(progress, active) {
        const p = animTrack.userData.positions, cum = pulseCum, n = cum.length;
        const base = new THREE.Color(document.getElementById('clr-track').value);
        const peak = new THREE.Color(document.getElementById('clr-highlight').value);

        // Put last frame's points back to their original height and the track color
        if (pulseRange) {
            for (let k = pulseRange[0]; k <= pulseRange[1]; k++) setTrackPoint(k, [p[k*3], p[k*3+1], p[k*3+2]], [base.r, base.g, base.b]);
            pulseRange = null;
        }

        if (active && n > 1) {
            const dCur = progress * cum[n - 1];
            let k = 0, hi = n;
            while (k < hi) { const mid = (k + hi) >> 1; if (cum[mid] < dCur - PULSE_RADIUS_M) k = mid + 1; else hi = mid; }
            const first = k;
            for (; k < n && cum[k] <= dCur + PULSE_RADIUS_M; k++) {
                const t = Math.max(0, 1 - Math.abs(cum[k] - dCur) / PULSE_RADIUS_M);
                const c = base.clone().lerp(peak, t);
                setTrackPoint(k, [p[k*3], p[k*3+1] + PULSE_LIFT * t, p[k*3+2]], [c.r, c.g, c.b]);
            }
            if (k > first) pulseRange = [first, k - 1];
        }

        animTrack.geometry.attributes.instanceStart.data.needsUpdate = true;
        animTrack.geometry.attributes.instanceColorStart.data.needsUpdate = true;
        animTrack.material.color.setRGB(1, 1, 1);  // vertex colors carry the color; keep the tint neutral
    }

    function stopPulse() {
        if (!pulseCum) return;
        updatePulse(0, false);
        animTrack.material.vertexColors = false;
        animTrack.material.needsUpdate = true;
        animTrack.material.color.set(document.getElementById('clr-highlight').value);
        pulseCum = null;
    }

    // ── Start/end markers ──
    // A vertical line grows up from the track's start (or end) point, then a label appears on top
    const MARKER_HEIGHT_M = 1000;
    let animMarkers = [];

    function makeTrailMarker(pointIdx, text) {
        const line = new Line2(new LineGeometry().setPositions([0, 0, 0, 0, 1, 0]),
            new LineMaterial({ linewidth: 4, resolution: new THREE.Vector2(innerWidth, innerHeight) }));
        const div = document.createElement('div');
        div.textContent = text;
        div.style.cssText = `color:#fff;font-size:${document.getElementById('sld-label-size').value}px;padding:2px 6px;background:rgba(0,0,0,0.55);border-radius:4px;white-space:nowrap;`;
        const label = new CSS2DObject(div);
        label.center.set(0.5, 1);
        line.visible = label.visible = false;
        scene.add(line, label);
        return { line, label, pointIdx };
    }

    function updateTrailMarker(m, growth) {
        const p = animTrack.userData.positions, i = m.pointIdx * 3;
        const h = MARKER_HEIGHT_M * S.scale;
        const baseY = p[i+1] + animTrack.position.y;
        m.line.position.set(p[i], baseY, p[i+2]);
        m.line.scale.y = Math.max(growth, 1e-4) * h;
        m.line.visible = growth > 0;
        m.line.material.resolution.set(innerWidth, innerHeight);
        m.line.material.color.set(document.getElementById('clr-highlight').value);
        m.label.position.set(p[i], baseY + h, p[i+2]);
        m.label.visible = growth >= 1 && m.label.element.textContent !== '';
    }

    function removeTrailMarkers() {
        for (const m of animMarkers) {
            scene.remove(m.line, m.label);
            m.line.geometry.dispose();
            m.line.material.dispose();
            m.label.element.remove();
        }
        animMarkers = [];
    }

    // ── Distance/ascent box ──
    // Shows the day with the distance and ascent covered so far, following the pulse
    const $animStats = document.getElementById('anim-stats');
    let animStatsText = null;

    function startAnimStats() {
        const i = animTrack.userData.trackIdx, cum = trackCumStats[i], last = cum.dist.length - 1;
        const km = d => (d / 1000).toFixed(1), m = g => String(Math.round(g));
        // Pad to the width of the day's totals so the text keeps its width while counting up
        const kmWidth = km(cum.dist[last]).length, mWidth = m(cum.gain[last]).length;
        const day = trackLabels[i].day;
        animStatsText = (d, g) => `${day ? day + ' ' : ''}${km(d).padStart(kmWidth)}km ${m(g).padStart(mWidth)}m`;
        $animStats.style.opacity = 0;
        $animStats.style.display = 'block';
    }

    function updateAnimStats(progress, opacity) {
        const cum = trackCumStats[animTrack.userData.trackIdx], pc = pulseCum, n = pc.length;
        // Find where the pulse is between track points k and k1, then interpolate the stats there
        const d = progress * pc[n - 1];
        let k = 0, hi = n - 1;
        while (k < hi) { const mid = (k + hi + 1) >> 1; if (pc[mid] <= d) k = mid; else hi = mid - 1; }
        const k1 = Math.min(k + 1, n - 1);
        const f = pc[k1] > pc[k] ? (d - pc[k]) / (pc[k1] - pc[k]) : 0;
        const at = a => a[k] + (a[k1] - a[k]) * f;
        $animStats.textContent = animStatsText(at(cum.dist), at(cum.gain));
        $animStats.style.opacity = opacity;
    }

    function stopAnimStats() {
        $animStats.style.display = 'none';
    }

    // Phase start times in ms from animation start
    function animPhases(duration) {
        const startMarkerStart = ANIM_LEAD_MS + STATS_FADE_MS;
        const pulseStart = startMarkerStart + MARKER_MS;
        const pulseEnd = pulseStart + duration + (animEndMode === 'farthest' ? MARKER_MS : 0);
        const endMarkerStart = animEndMode === 'farthest' ? pulseStart + animFarFrac * duration : pulseEnd;
        const total = pulseEnd + (animEndMode === 'end' ? MARKER_MS : 0) + ANIM_TAIL_MS;
        return { startMarkerStart, pulseStart, pulseEnd, endMarkerStart, total };
    }

    function updateTrackAnimation(t, duration) {
        const clamp01 = x => Math.min(Math.max(x, 0), 1);
        const { startMarkerStart, pulseStart, endMarkerStart } = animPhases(duration);
        updateTrailMarker(animMarkers[0], clamp01((t - startMarkerStart) / MARKER_MS));
        if (animMarkers[1]) updateTrailMarker(animMarkers[1], clamp01((t - endMarkerStart) / MARKER_MS));
        // Pulse clock, held still at the farthest point while its marker appears
        let pt = t - pulseStart;
        if (animEndMode === 'farthest') {
            const holdAt = animFarFrac * duration;
            if (pt > holdAt) pt = Math.max(holdAt, pt - MARKER_MS);
        }
        const progress = clamp01(pt / duration);
        updatePulse(progress, t >= pulseStart);  // stays at the track's end once done, until the camera stops
        updateAnimStats(progress, clamp01((t - ANIM_LEAD_MS) / STATS_FADE_MS));
    }

    function stopTrackAnimation() {
        trackAnimating = false;
        $btnAnimate.classList.remove('playing');
        $btnAnimate.innerHTML = '&#9654;';
        stopAllCameraMotion();
        stopPulse();
        removeTrailMarkers();
        stopAnimStats();
        if (controlsWereVisible) $rotBox.classList.add('active');
    }

    $btnAnimate.addEventListener('click', () => {
        if (!scene) return;
        if (trackAnimating) { stopTrackAnimation(); return; }
        const hlIdx = document.getElementById('sel-highlight').value;
        animTrack = null;
        scene.traverse(o => { if (o.name === 'gpx-track' && o.userData.trackIdx === +hlIdx) animTrack = o; });
        if (hlIdx === '' || !animTrack) return;
        trackAnimating = true;
        $btnAnimate.classList.add('playing');
        $btnAnimate.innerHTML = '&#9646;&#9646;';
        trackAnimStart = performance.now();
        startPulse();
        startAnimStats();
        // Keep the frame clean while animating; the A key still stops it
        controlsWereVisible = $rotBox.classList.contains('active');
        $rotBox.classList.remove('active');
        animMarkers = [makeTrailMarker(0, document.getElementById('txt-start-label').value)];
        animEndMode = document.getElementById('sel-end-marker').value;
        if (animEndMode !== 'none') {
            const farIdx = trackFarthestIdx[animTrack.userData.trackIdx];
            const totalDist = pulseCum[pulseCum.length - 1];
            animFarFrac = totalDist > 0 ? pulseCum[farIdx] / totalDist : 0;
            const endIdx = animEndMode === 'farthest' ? farIdx : animTrack.userData.positions.length / 3 - 1;
            animMarkers.push(makeTrailMarker(endIdx, document.getElementById('txt-end-label').value));
        }
        startCameraMotion();
    });

    document.getElementById('sld-animate-dur').addEventListener('input', e => {
        document.getElementById('animate-dur-val').textContent = e.target.value + 's';
    });

    // ── Keyboard Shortcuts ────────────────────────────────────────

    const KEY_ROT = 0.03;

    // Let focused form controls keep keys they use natively (type-ahead, arrow stepping)
    function isKeyClaimedByFocus(e) {
        const el = e.target;
        if (el.isContentEditable || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return true;
        if (el.tagName !== 'INPUT') return false;
        if (el.type === 'range') return e.key.startsWith('Arrow');
        return !['checkbox', 'color', 'file', 'button'].includes(el.type);
    }

    document.addEventListener('keydown', e => {
        if (isKeyClaimedByFocus(e)) return;
        if (e.key === 'c' || e.key === 'C') {
            $rotBox.classList.toggle('active');
        }
        if (e.key === 'a' || e.key === 'A') {
            $btnAnimate.click();
        }
        if (e.key === 's' || e.key === 'S') {
            document.getElementById('stats-box').classList.toggle('active');
        }
        if (!controls) return;
        const sphere = new THREE.Spherical().setFromVector3(
            camera.position.clone().sub(controls.target)
        );
        if (e.key === 'ArrowLeft')  { sphere.theta -= KEY_ROT; e.preventDefault(); }
        if (e.key === 'ArrowRight') { sphere.theta += KEY_ROT; e.preventDefault(); }
        if (e.key === 'ArrowUp')    { sphere.phi = Math.max(0.1, sphere.phi - KEY_ROT); e.preventDefault(); }
        if (e.key === 'ArrowDown')  { sphere.phi = Math.min(Math.PI * 0.85, sphere.phi + KEY_ROT); e.preventDefault(); }
        camera.position.copy(new THREE.Vector3().setFromSpherical(sphere).add(controls.target));
    });

    // ── Events ──────────────────────────────────────────────────

    $fileInput.addEventListener('change', e => { if (e.target.files.length) processFiles(e.target.files); });

    $dropzone.addEventListener('dragover', e => { e.preventDefault(); $dropzone.classList.add('dragover'); });
    $dropzone.addEventListener('dragleave', () => $dropzone.classList.remove('dragover'));
    $dropzone.addEventListener('drop', e => {
        e.preventDefault();
        $dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
    });

    // ── Scene export/import ──
    // Scene file layout: magic, uint32 header length, JSON header, elevation grid (Float64), then one JPEG per
    // texture tile. Keeping the bulky parts binary avoids building one huge string: browsers cap strings at about
    // 512M characters, which multi-tile high-resolution scenes exceed as base64 JSON.
    const SCENE_MAGIC = 'GPX3DSCN';

    function encodeTile(canvas) {
        // JPEG keeps large multi-tile exports manageable; the satellite source tiles are JPEG anyway
        return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('Could not encode texture tile')), 'image/jpeg', 0.92));
    }

    const $btnExport = document.getElementById('btn-export');
    $btnExport.addEventListener('click', async () => {
        if (!cachedTerrainData) return;
        $btnExport.disabled = true;
        $btnExport.textContent = 'Exporting…';
        try {
            const { texTiles, elev, ...rest } = cachedTerrainData;
            const tileBlobs = [];
            for (const t of texTiles) tileBlobs.push(await encodeTile(t.canvas));  // one at a time to limit memory
            const header = new TextEncoder().encode(JSON.stringify({
                ...rest,
                elevBytes: elev.byteLength,
                texTiles: texTiles.map((t, i) => ({ offset: t.offset, repeat: t.repeat, bytes: tileBlobs[i].size })),
            }));
            const headerLen = new Uint8Array(4);
            new DataView(headerLen.buffer).setUint32(0, header.length, true);
            const blob = new Blob([SCENE_MAGIC, headerLen, header, elev, ...tileBlobs], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'scene-data.gpx3d';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 60000);  // give large downloads time to start
        } catch (err) {
            console.error(err);
            alert('Export failed: ' + err.message);
        } finally {
            $btnExport.disabled = false;
            $btnExport.textContent = 'Export scene data';
        }
    });

    async function canvasFromImage(src) {
        // src is a Blob from a scene file, or a data URL from an older JSON export
        const img = src instanceof Blob ? await createImageBitmap(src) : await new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = () => rej(new Error('Could not decode texture tile'));
            i.src = src;
        });
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        if (img.close) img.close();
        return canvas;
    }

    async function readSceneFile(file, onTile) {
        const bytes = async (start, end) => new Uint8Array(await file.slice(start, end).arrayBuffer());

        if (new TextDecoder().decode(await bytes(0, SCENE_MAGIC.length)) !== SCENE_MAGIC) {
            // Older JSON export
            const data = JSON.parse(await file.text());
            if (!data.texTiles) throw new Error('Unsupported scene file');
            const texTiles = [];
            for (const [i, t] of data.texTiles.entries()) {
                texTiles.push({ canvas: await canvasFromImage(t.dataURL), offset: t.offset, repeat: t.repeat });
                onTile(i + 1, data.texTiles.length);
            }
            return { ...data, elev: new Float64Array(data.elev), texTiles };
        }

        let pos = SCENE_MAGIC.length;
        const headerLen = new DataView((await bytes(pos, pos + 4)).buffer).getUint32(0, true);
        pos += 4;
        const { elevBytes, texTiles: tileInfo, ...rest } = JSON.parse(new TextDecoder().decode(await bytes(pos, pos + headerLen)));
        pos += headerLen;
        const elev = new Float64Array(await file.slice(pos, pos + elevBytes).arrayBuffer());
        pos += elevBytes;
        const texTiles = [];
        for (const [i, t] of tileInfo.entries()) {
            texTiles.push({ canvas: await canvasFromImage(file.slice(pos, pos + t.bytes, 'image/jpeg')), offset: t.offset, repeat: t.repeat });
            pos += t.bytes;
            onTile(i + 1, tileInfo.length);
        }
        if (pos !== file.size) throw new Error('Scene file is truncated or corrupt');
        return { ...rest, elev, texTiles };
    }

    document.getElementById('import-input').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        $landing.style.display = 'none';
        $progress.classList.add('active');
        prog('Loading scene data...', 20);
        try {
            const scene = await readSceneFile(file, (d, t) => prog('Restoring texture...', 30 + (d / t) * 55, `Tile ${d} / ${t}`));
            const { elev, bb, gw, gh, texTiles } = scene;
            const tracks = (scene.tracks || []).map(pts =>
                pts.map(p => ({ ...p, time: p.time ? new Date(p.time) : null }))
            );
            const trackNames = scene.trackNames || [];

            cachedTerrainData = scene;

            prog('Building 3D scene...', 90);
            await new Promise(r => setTimeout(r, 80));
            buildScene(elev, texTiles, tracks, bb, gw, gh);

            prog('Done!', 100);
            await new Promise(r => setTimeout(r, 350));
            showViewer(tracks, trackNames);
        } catch (err) {
            prog('Error', 0, err.message);
            console.error(err);
        }
    });

    </script>
</body>
