        scene.traverse(o => {
            if (o.name === 'gpx-track') {
                const hit = idx !== '' && o.userData.trackIdx === +idx;
                o.material.color.set(hit ? document.getElementById('clr-highlight').value : document.getElementById('clr-track').value);
                const baseOff = +document.getElementById('sld-track-offset').value;
                o.position.y = baseOff + (hit ? HIGHLIGHT_LIFT : 0);
            }
        });
    });

    $btnCenter.addEventListener('click', () => {
        if (!controls) return;
        const idx = document.getElementById('sel-highlight').value;
        if (idx !== '' && trackMidpoints[+idx]) {
            controls.target.copy(trackMidpoints[+idx]);
        }
    });

    $btnHead.addEventListener('click', () => {
        if (!controls) return;
        const idx = document.getElementById('sel-highlight').value;
        if (idx === '' || !trackHeads[+idx]) return;
        const head = trackHeads[+idx], far = trackFarthest[+idx];
        const sph = new THREE.Spherical().setFromVector3(
            camera.position.clone().sub(controls.target)
        );
        // Place the camera behind the head so the view runs through it toward the farthest point
        if (far.x !== head.x || far.z !== head.z) sph.theta = Math.atan2(head.x - far.x, head.z - far.z);
        controls.target.copy(head);
        camera.position.copy(new THREE.Vector3().setFromSpherical(sph).add(head));
    });

    document.getElementById('btn-recenter').addEventListener('click', () => {
        if (!controls || !origTarget) return;
        controls.target.copy(origTarget);
    });

    // ── Track animation ─────────────────────────────────────────

    // Timeline: camera-only lead-in → stats box fades in → start marker → pulse (slider duration) → end marker
    // → camera-only tail. With the end marker at the farthest point, the pulse instead holds there while the
    // marker appears. Once the pulse arrives, the whole track fades to the highlight color (FILL_MS), overlapping
    // the end marker or the tail. The camera keeps moving and the stats box stays up until the very end.
    const ANIM_LEAD_MS = 2000;
    const STATS_FADE_MS = 500;
    const MARKER_MS = 500;
    const FILL_MS = 1000;  // after the pulse arrives, the whole track fades to the highlight color
    const ANIM_TAIL_MS = 4000;
    let trackAnimating = false;
    let trackAnimStart = 0;
    let animTrack = null;
    let animEndMode = 'end';
    let controlsWereVisible = false;
    let animFarFrac = 0;  // Fraction of the track's length at which the farthest point lies
    let animOverview = 'none';  // Overview setting ('none', 'in', 'out'), read when the animation starts
    let timelineStarted = false;  // Whether the animation proper has begun (it waits for the zoom-in)
    const $btnAnimate = document.getElementById('btn-animate');

    // ── Pulse ──
    // Recolors tracks themselves: highlight color at the current point, fading to the track color PULSE_RADIUS_M
    // before and after it. Those points are also raised (up to PULSE_LIFT at the current point) so the pulse stays on
    // top where an out-and-back track overlaps itself. Each recolored track has a state {track, cum, range}: cum is
    // the distance in meters to each track point, range the points currently recolored.
    const PULSE_RADIUS_M = 1000;
    const PULSE_LIFT = 0.005;
    let pulseStates = [];
    let pulseCum = null;  // The daily animation's track's cum

    // Track point k is the end of segment k-1 and the start of segment k in Line2's interleaved buffers
    function setTrackPoint(st, k, xyz, rgb) {
        const g = st.track.geometry, last = st.cum.length - 1;
        const pos = g.attributes.instanceStart.data.array, col = g.attributes.instanceColorStart.data.array;
        if (k > 0) { pos.set(xyz, (k - 1) * 6 + 3); col.set(rgb, (k - 1) * 6 + 3); }
        if (k < last) { pos.set(xyz, k * 6); col.set(rgb, k * 6); }
    }

    function startPulseOn(track) {
        const p = track.userData.positions, n = p.length / 3;
        const cum = new Float64Array(n);
        for (let k = 1; k < n; k++) {
            const dx = p[k*3] - p[k*3-3], dy = p[k*3+1] - p[k*3-2], dz = p[k*3+2] - p[k*3-1];
            cum[k] = cum[k-1] + Math.hypot(dx, dy, dz) / S.scale;
        }
        const g = track.geometry;
        if (!g.attributes.instanceColorStart) g.setColors(new Float32Array(n * 3));
        const base = new THREE.Color(document.getElementById('clr-track').value);
        const col = g.attributes.instanceColorStart.data;
        for (let i = 0; i < col.array.length; i += 3) col.array.set([base.r, base.g, base.b], i);
        col.needsUpdate = true;
        track.material.vertexColors = true;
        track.material.needsUpdate = true;
        track.material.color.setRGB(1, 1, 1);  // vertex colors carry the color; keep the tint neutral
        const st = { track, cum, range: null };
        pulseStates.push(st);
        return st;
    }

    // dCur: the pulse's distance along this track; it may lie off the track, then only the overlapping part shows.
    // fill (0..1) blends the whole track toward the highlight color once the pulse has arrived.
    function updatePulseOn(st, dCur, active, fill = 0, radius = PULSE_RADIUS_M) {
        const p = st.track.userData.positions, cum = st.cum, n = cum.length;
        const base = new THREE.Color(document.getElementById('clr-track').value);
        const peak = new THREE.Color(document.getElementById('clr-highlight').value);
        let changed = false;

        // Put last frame's points back to their original height and the track color
        if (st.range) {
            for (let k = st.range[0]; k <= st.range[1]; k++) setTrackPoint(st, k, [p[k*3], p[k*3+1], p[k*3+2]], [base.r, base.g, base.b]);
            st.range = null;
            changed = true;
        }

        if ((active || fill > 0) && n > 1) {
            // Points [first, end) to update: the pulse window, or the whole track while filling
            let first = 0, end = n;
            if (fill === 0) {
                let hi = n;
                while (first < hi) { const mid = (first + hi) >> 1; if (cum[mid] < dCur - radius) first = mid + 1; else hi = mid; }
                end = first;
                while (end < n && cum[end] <= dCur + radius) end++;
            }
            const c = new THREE.Color();
            for (let k = first; k < end; k++) {
                const t = active ? Math.max(0, 1 - Math.abs(cum[k] - dCur) / radius) : 0;
                c.copy(base).lerp(peak, t + (1 - t) * fill);
                setTrackPoint(st, k, [p[k*3], p[k*3+1] + PULSE_LIFT * t, p[k*3+2]], [c.r, c.g, c.b]);
            }
            if (end > first) { st.range = [first, end - 1]; changed = true; }
        }

        if (changed) {  // only upload tracks that changed (the flyover has many)
            st.track.geometry.attributes.instanceStart.data.needsUpdate = true;
            st.track.geometry.attributes.instanceColorStart.data.needsUpdate = true;
        }
    }

    // Restores every recolored track; the selected track gets its highlight color back
    function stopPulse() {
        const sel = document.getElementById('sel-highlight').value;
        for (const st of pulseStates) {
            updatePulseOn(st, 0, false);
            st.track.material.vertexColors = false;
            st.track.material.needsUpdate = true;
            const selected = sel !== '' && st.track.userData.trackIdx === +sel;
            st.track.material.color.set(document.getElementById(selected ? 'clr-highlight' : 'clr-track').value);
        }
        pulseStates = [];
        pulseCum = null;
    }

    // The daily animation's pulse on animTrack, with progress 0..1 along it
    function startPulse() {
        pulseCum = startPulseOn(animTrack).cum;
    }

    function updatePulse(progress, active, fill = 0) {
        updatePulseOn(pulseStates[0], progress * pulseCum[pulseCum.length - 1], active, fill);
    }

    // ── Start/end markers ──
    // A vertical line grows up from a point, then a label appears on top. base() gives the point, so markers on a
    // track follow its offset.
    const MARKER_HEIGHT_M = 1000;
    let animMarkers = [];

    // A live base point on a track: track point k, including the track's offset
    const trackPoint = (track, k) => () => {
        const p = track.userData.positions;
        return new THREE.Vector3(p[k * 3], p[k * 3 + 1] + track.position.y, p[k * 3 + 2]);
    };

    // The label shows the text and, below it at 60% size, the elevation (meters) if given
    function makeTrailMarker(text, base, elevation = null) {
        const line = new Line2(new LineGeometry().setPositions([0, 0, 0, 0, 1, 0]),
            new LineMaterial({ linewidth: 4, transparent: true, resolution: new THREE.Vector2(innerWidth, innerHeight) }));
        const div = document.createElement('div');
        div.textContent = text;
        if (elevation != null) {
            const ele = document.createElement('div');
            ele.style.fontSize = '60%';
            ele.textContent = `${Math.round(elevation)} m`;
            div.appendChild(ele);
        }
        // 1.65× the regular label size
        div.style.cssText = `color:#fff;font-size:${document.getElementById('sld-label-size').value * 1.65}px;padding:3px 10px;background:rgba(0,0,0,0.55);border-radius:7px;white-space:nowrap;text-align:center;`;
        const label = new CSS2DObject(div);
        label.center.set(0.5, 1);
        line.visible = label.visible = false;
        scene.add(line, label);
        return { line, label, base, text };
    }

    function updateTrailMarker(m, growth, opacity = 1) {
        const b = m.base(), h = MARKER_HEIGHT_M * S.scale;
        m.line.position.copy(b);
        m.line.scale.y = Math.max(growth, 1e-4) * h;
        m.line.visible = growth > 0 && opacity > 0;
        m.line.material.opacity = opacity;
        m.line.material.resolution.set(innerWidth, innerHeight);
        m.line.material.color.set(document.getElementById('clr-highlight').value);
        m.label.position.set(b.x, b.y + h, b.z);
        m.label.visible = growth >= 1 && opacity > 0 && m.text !== '';
        m.label.element.style.opacity = opacity;
    }

    function removeTrailMarkers() {
        for (const m of animMarkers) {
            scene.remove(m.line, m.label);
            m.line.geometry.dispose();
            m.line.material.dispose();
            m.label.element.remove();
        }
        animMarkers = [];
    }

    // ── Distance/ascent box ──
    // Shows the day with the distance and ascent covered so far, following the pulse
    const $animStats = document.getElementById('anim-stats');
    let animStatsText = null;

    function startAnimStats() {
        const i = animTrack.userData.trackIdx, cum = trackCumStats[i], last = cum.dist.length - 1;
        const km = d => (d / 1000).toFixed(1), m = g => String(Math.round(g));
        // Pad to the width of the day's totals so the text keeps its width while counting up
        const kmWidth = km(cum.dist[last]).length, mWidth = m(cum.gain[last]).length;
        const day = trackLabels[i].day.replace(/^D/, 'Day ');  // "D01" -> "Day 01"
        animStatsText = (d, g) => `${day ? day + ' ' : ''}${km(d).padStart(kmWidth)}km ${m(g).padStart(mWidth)}m`;
        $animStats.style.opacity = 0;
        $animStats.style.display = 'block';
    }

    function updateAnimStats(progress, opacity) {
        const cum = trackCumStats[animTrack.userData.trackIdx], pc = pulseCum, n = pc.length;
        // Find where the pulse is between track points k and k1, then interpolate the stats there
        const d = progress * pc[n - 1];
        let k = 0, hi = n - 1;
        while (k < hi) { const mid = (k + hi + 1) >> 1; if (pc[mid] <= d) k = mid; else hi = mid - 1; }
        const k1 = Math.min(k + 1, n - 1);
        const f = pc[k1] > pc[k] ? (d - pc[k]) / (pc[k1] - pc[k]) : 0;
        const at = a => a[k] + (a[k1] - a[k]) * f;
        $animStats.textContent = animStatsText(at(cum.dist), at(cum.gain));
        $animStats.style.opacity = opacity;
    }

    function stopAnimStats() {
        $animStats.style.display = 'none';
    }

    // Phase start times in ms from animation start
    function animPhases(duration) {
        const startMarkerStart = ANIM_LEAD_MS + STATS_FADE_MS;
        const pulseStart = startMarkerStart + MARKER_MS;
        const pulseEnd = pulseStart + duration + (animEndMode === 'farthest' ? MARKER_MS : 0);
        const endMarkerStart = animEndMode === 'farthest' ? pulseStart + animFarFrac * duration : pulseEnd;
        const total = pulseEnd + (animEndMode === 'end' ? MARKER_MS : 0) + ANIM_TAIL_MS;
        return { startMarkerStart, pulseStart, pulseEnd, endMarkerStart, total };
    }

    function updateTrackAnimation(t, duration) {
        const clamp01 = x => Math.min(Math.max(x, 0), 1);
        const { startMarkerStart, pulseStart, pulseEnd, endMarkerStart } = animPhases(duration);
        updateTrailMarker(animMarkers[0], clamp01((t - startMarkerStart) / MARKER_MS));
        if (animMarkers[1]) updateTrailMarker(animMarkers[1], clamp01((t - endMarkerStart) / MARKER_MS));
        // Pulse clock, held still at the farthest point while its marker appears
        let pt = t - pulseStart;
        if (animEndMode === 'farthest') {
            const holdAt = animFarFrac * duration;
            if (pt > holdAt) pt = Math.max(holdAt, pt - MARKER_MS);
        }
        const progress = clamp01(pt / duration);
        if (document.getElementById('sel-sky').value === 'night-to-day') applyNightToDay(progress);
        // Stays at the track's end once done, until the camera stops
        updatePulse(progress, t >= pulseStart, clamp01((t - pulseEnd) / FILL_MS));
        updateAnimStats(progress, clamp01((t - ANIM_LEAD_MS) / STATS_FADE_MS));
    }

    // ── Overview: zoom in at the start / zoom out at the end ──
    // Both use a north-up, top-down view of the whole trek with the place labels. Zoom in: start there, drift slowly
    // in for ZOOM_HOLD_MS while the labels fade out at the end, then move over ZOOM_OUT_MS to the camera as it was when
    // Play was pressed, and run the animation. Zoom out: after the animation, drop the markers and stats box,
    // de-highlight the track, move to the overview over ZOOM_OUT_MS, then drift slowly out for ZOOM_HOLD_MS while the
    // labels and then the trek totals fade in.
    const ZOOM_OUT_MS = 2000;
    const ZOOM_HOLD_MS = 8000;
    const ZOOM_HOLD_DRIFT = 0.05;  // Fraction the camera distance changes during the hold
    const ZOOM_LABEL_FADE_MS = 1000;
    const ZOOM_TOTALS_FADE_MS = 1000;
    const $trekStats = document.getElementById('trek-stats');
    // Overview labels sit above their point unless listed here (for places close to each other)
    const ZOOM_LABEL_SIDES = { 'EBC': 'right', 'Kala Patthar': 'left' };
    let zoomIn = null;   // {play, overview} camera views while zooming in
    let zoomOut = null;  // {from, to} camera views while zooming out
    let zoomLabels = [];

    // All track objects in day order
    function allTracks() {
        const tracks = [];
        scene.traverse(o => { if (o.name === 'gpx-track') tracks.push(o); });
        return tracks.sort((a, b) => a.userData.trackIdx - b.userData.trackIdx);
    }

    // EBC-specific places not in the track names: a label at the highest point of a track
    const EXTRA_PLACES = [{ track: 'Thagnak to Dzongla', text: 'Cho La Pass' }];

    // A track's places, in order along it: [{text, k}], k being the track point the label belongs to. They come from
    // its name, plus EXTRA_PLACES.
    function trackPlaces(track) {
        const i = track.userData.trackIdx, lb = trackLabels[i];
        const places = lb.start ? [{ text: lb.start, k: 0 }] : [];
        if (lb.endMode !== 'none' && lb.end) {
            places.push({ text: lb.end, k: lb.endMode === 'farthest' ? trackFarthestIdx[i] : track.userData.positions.length / 3 - 1 });
        }
        for (const extra of EXTRA_PLACES) {
            if (extra.track !== lb.display) continue;
            const ele = trackCumStats[i].ele;
            let highest = 0;
            for (let k = 1; k < ele.length; k++) if (ele[k] > ele[highest]) highest = k;
            places.push({ text: extra.text, k: highest });
        }
        return places.sort((a, b) => a.k - b.k);
    }

    // Each place's position, merged across tracks: label text -> average of its track points
    function placePositions() {
        const sums = new Map();
        for (const track of allTracks()) {
            for (const { text, k } of trackPlaces(track)) {
                const sum = sums.get(text) || { pos: new THREE.Vector3(), n: 0 };
                sum.pos.add(trackPoint(track, k)());
                sum.n++;
                sums.set(text, sum);
            }
        }
        return new Map([...sums].map(([text, { pos, n }]) => [text, pos.divideScalar(n)]));
    }

    // One label per place, 0.6× the size of the start/end marker labels and with no vertical line, since we look
    // top-down
    function makeZoomLabels() {
        const fontSize = document.getElementById('sld-label-size').value * 1.65 * 0.6;
        for (const [text, pos] of placePositions()) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.cssText = `color:#fff;font-size:${fontSize}px;padding:2px 6px;background:rgba(0,0,0,0.55);border-radius:4px;white-space:nowrap;opacity:0;`;
            const label = new CSS2DObject(div);
            const side = ZOOM_LABEL_SIDES[text];
            // center is the label's anchor point: (0.5, 1) puts it above the point (north in the top-down view)
            if (side === 'right') { label.center.set(0, 0.5); div.style.marginLeft = '4px'; }
            else if (side === 'left') { label.center.set(1, 0.5); div.style.marginLeft = '-4px'; }
            else label.center.set(0.5, 1);
            label.position.copy(pos);
            scene.add(label);
            zoomLabels.push(label);
        }
    }

    function setZoomLabelOpacity(opacity) {
        for (const label of zoomLabels) label.element.style.opacity = opacity;
    }

    function removeZoomLabels() {
        for (const label of zoomLabels) {
            scene.remove(label);
            label.element.remove();
        }
        zoomLabels = [];
    }

    // Total distance and ascent over all loaded tracks, measured like the daily stats box
    function showTrekTotals() {
        let dist = 0, gain = 0;
        for (const cum of trackCumStats) {
            dist += cum.dist[cum.dist.length - 1] || 0;
            gain += cum.gain[cum.gain.length - 1] || 0;
        }
        $trekStats.textContent = `Total ${(dist / 1000).toFixed(1)}km ${Math.round(gain)}m`;
        $trekStats.style.opacity = 0;
        $trekStats.style.display = 'block';
    }

    // Camera views are {target, sph}: the orbit target and the camera's offset from it
    function cameraView() {
        return { target: controls.target.clone(), sph: new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)) };
    }

    // North-up, top-down view that fits all tracks inside the 16:9 frame guide with a margin
    function overviewView() {
        const box = new THREE.Box3(), v = new THREE.Vector3();
        scene.traverse(o => {
            if (o.name !== 'gpx-track') return;
            const p = o.userData.positions;
            for (let i = 0; i < p.length; i += 3) box.expandByPoint(v.set(p[i], p[i + 1] + o.position.y, p[i + 2]));
        });
        const size = box.getSize(new THREE.Vector3());
        // Extents are measured at the box's top, which is closest to the camera and so appears largest
        const frameW = Math.min(innerWidth, innerHeight * 16 / 9), frameH = Math.min(innerHeight, innerWidth * 9 / 16);
        const perUnit = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);  // visible height per unit of distance
        const fit = 1.15 * Math.max(size.z / (perUnit * frameH / innerHeight), size.x / (perUnit * camera.aspect * frameW / innerWidth));
        // Theta 0 puts the camera on the south side, so north is at the top of the screen. Phi can't be exactly 0:
        // looking straight down leaves the orientation undefined.
        return { target: box.getCenter(new THREE.Vector3()), sph: new THREE.Spherical(fit + size.y / 2, 1e-4, 0) };
    }

    // Puts the camera e (0..1) of the way from view a to view b, turning the short way around; scale multiplies the
    // distance
    function setCameraBetween(a, b, e, scale = 1) {
        const turn = (((b.sph.theta - a.sph.theta) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
        const sph = new THREE.Spherical(
            (a.sph.radius + (b.sph.radius - a.sph.radius) * e) * scale,
            a.sph.phi + (b.sph.phi - a.sph.phi) * e,
            a.sph.theta + turn * e);
        controls.target.lerpVectors(a.target, b.target, e);
        camera.position.setFromSpherical(sph).add(controls.target);
    }

    function startZoomIn() {
        zoomIn = { play: cameraView(), overview: overviewView() };
        makeZoomLabels();
        setZoomLabelOpacity(1);
        controls.enableDamping = false;  // damping inertia would drift the camera off the path we set each frame
    }

    function updateZoomIn(elapsed) {
        const { play, overview } = zoomIn;
        if (elapsed < ZOOM_HOLD_MS) {
            const left = 1 - elapsed / ZOOM_HOLD_MS;
            setCameraBetween(overview, overview, 0, 1 + ZOOM_HOLD_DRIFT * left * left);  // eases out of the drift
            setZoomLabelOpacity(Math.min((ZOOM_HOLD_MS - elapsed) / ZOOM_LABEL_FADE_MS, 1));
        } else {
            if (zoomLabels.length) removeZoomLabels();
            setCameraBetween(overview, play, smoothstep(0, 1, (elapsed - ZOOM_HOLD_MS) / ZOOM_OUT_MS));
        }
    }

    function startZoomOut() {
        removeTrailMarkers();
        stopAnimStats();
        stopAllCameraMotion();
        stopPulse();
        animTrack.material.color.set(document.getElementById('clr-track').value);
        animTrack.position.y = +document.getElementById('sld-track-offset').value;
        zoomOut = { from: cameraView(), to: overviewView() };
        controls.enableDamping = false;
    }

    function updateZoomOut(elapsed) {
        if (!zoomOut) startZoomOut();
        const hold = Math.max(0, elapsed - ZOOM_OUT_MS) / ZOOM_HOLD_MS;
        setCameraBetween(zoomOut.from, zoomOut.to, smoothstep(0, 1, elapsed / ZOOM_OUT_MS), 1 + ZOOM_HOLD_DRIFT * hold * hold);  // eases into the drift
        if (elapsed >= ZOOM_OUT_MS) {
            if (!zoomLabels.length) makeZoomLabels();
            setZoomLabelOpacity(Math.min((elapsed - ZOOM_OUT_MS) / ZOOM_LABEL_FADE_MS, 1));
        }
        const totalsElapsed = elapsed - ZOOM_OUT_MS - ZOOM_LABEL_FADE_MS;
        if (totalsElapsed >= 0) {
            if ($trekStats.style.display !== 'block') showTrekTotals();
            $trekStats.style.opacity = Math.min(totalsElapsed / ZOOM_TOTALS_FADE_MS, 1);
        }
    }

    // The animation proper begins (after the zoom-in, if any): hand the camera back and start its motion
    function startTimeline() {
        timelineStarted = true;
        if (zoomIn) {
            zoomIn = null;
            removeZoomLabels();
            controls.enableDamping = true;
        }
        startCameraMotion();
    }

    // ── Flyover: the whole trek, when no track is selected ──
    // Overview → descend to the trail head → fly along all tracks in day order with the pulse, each place getting its
    // line and label the first time the pulse reaches it (slowing down there) → zoom out. The camera flies a smooth
    // curve through the end points of the days rather than the trail itself, so it never turns sharply; the pulse
    // isn't always centered.
    const FLY_OVERVIEW_MS = 3000;
    const FLY_DESCENT_MS = 5000;
    const FLY_RAMP_MS = 2000;           // The flight eases in from and out to a standstill over this
    const FLY_ZOOM_OUT_MS = 4000;
    const FLY_HOLD_MS = 6000;
    const FLY_STATS_FADE_MS = 1000;     // The stats box fades in at the end of the descent
    const FLY_MARKER_OUT_MS = 1000;     // When zooming out, the last place's marker fades out,
    const FLY_LABELS_IN_MS = 2000;      // and all place labels fade in at the end of the zoom out
    const FLY_GROW_MS = 800;            // At each place and day's end the pulse (and the counters) stop while the
    const FLY_LABEL_HOLD_MS = 1000;     // place's line grows, then for a moment with the label up, to read the stats;
    const FLY_PAUSE_MS = FLY_GROW_MS + FLY_LABEL_HOLD_MS;
    const FLY_BRAKE_M = 400;            // braking to the stop and accelerating away over this distance
    const FLY_PULSE_RADIUS_M = 500;     // Half the daily animation's pulse
    const FLY_TURN_SMOOTH_M = 5000;     // The camera heading is averaged over this distance each way, spreading turns out
    const FLY_POLAR = THREE.MathUtils.degToRad(62);  // Camera angle from vertical
    const FLY_HEIGHT_M = 3000;          // Camera height above the trail point
    const FLY_DISTANCE_M = FLY_HEIGHT_M / Math.cos(FLY_POLAR);
    const FLY_AIM_UP_M = FLY_DISTANCE_M / 6;  // The camera aims this far above the trail, for more sky in the picture
    // EBC-specific: compass direction (degrees) the camera faces when these tracks end; elsewhere it faces along
    // its path
    const FLY_HEADINGS = {
        'Gokyo to Gokyo Ri': 90,          // turn east while Gokyo Ri is hiked
        'Gorakshep to EBC': 90,           // at Gorakshep, turn east for EBC,
        'Gorakshep to Kala Patthar': 180, // then south for Kala Patthar, ready for the way down
        'Namche to Lukla': 125,           // arrive at Lukla facing about south-east (the averaging softens it), to see
                                          // the bend before it
    };
    // Tracks whose end gets no heading of its own: the camera turns straight through toward the next one (leaving
    // Machhermo it already starts turning east for Gokyo Ri; leaving Lobuche, east for EBC)
    const FLY_TURN_THROUGH = ['Machhermo to Gokyo', 'Lobuche to Gorakshep'];
    const FLY_LOOP_DRIFT = 0.08;        // On a loop day (e.g. the rest day at Namche) the camera creeps this fraction of
                                        // the way toward the next day's end
    const FLY_TURN_TIME_MS = 1500;      // Turning follows the flight averaged over this time each way, so it keeps its
                                        // pace while the flight slows down near places
    const $flyStats = document.getElementById('fly-stats');
    let fly = null;

    // Cubic Hermite through values (arrays of numbers) at increasing positions ss, with Catmull-Rom tangents taken
    // per unit of s, so the rate of change doesn't jump at the keys. At keys marked gentle, the tangent is capped at
    // the neighboring segments' slopes, so a short segment between two gentle keys is crossed at an even, slow pace
    // instead of being overshot and doubled back on. Returns s -> array of numbers.
    function smoothSpline(ss, values, gentle = []) {
        const n = ss.length, dims = values[0].length;
        const norm = v => Math.hypot(...v);
        const slope = k => norm(values[k + 1].map((v, d) => v - values[k][d])) / (ss[k + 1] - ss[k]);
        const tangents = values.map((_, k) => {
            const a = Math.max(k - 1, 0), b = Math.min(k + 1, n - 1);
            const m = values[0].map((_, d) => (values[b][d] - values[a][d]) / (ss[b] - ss[a]));
            if (!gentle[k]) return m;
            const cap = Math.min(k > 0 ? slope(k - 1) : Infinity, k < n - 1 ? slope(k) : Infinity);
            const len = norm(m);
            return len > cap ? m.map(v => v * cap / len) : m;
        });
        return s => {
            let k = 0;
            while (k < n - 2 && s > ss[k + 1]) k++;
            const h = ss[k + 1] - ss[k], u = Math.min(Math.max((s - ss[k]) / h, 0), 1);
            const u2 = u * u, u3 = u2 * u;
            const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
            const out = [];
            for (let d = 0; d < dims; d++) {
                out.push(h00 * values[k][d] + h10 * h * tangents[k][d] + h01 * values[k + 1][d] + h11 * h * tangents[k + 1][d]);
            }
            return out;
        };
    }

    function startFlyover() {
        const tracks = allTracks();
        // The trek as one route: tracks back to back in day order (the small gaps between days are skipped)
        let s = 0, distBefore = 0, gainBefore = 0;
        const legs = tracks.map(track => {
            const st = startPulseOn(track), cum = trackCumStats[track.userData.trackIdx];
            const leg = { st, track, offset: s, len: st.cum[st.cum.length - 1], cum, distBefore, gainBefore };
            s += leg.len;
            distBefore += cum.dist[cum.dist.length - 1];
            gainBefore += cum.gain[cum.gain.length - 1];
            return leg;
        });
        const total = s;

        // Places in the order the pulse passes them, at the route distance where it does. A place shows again when
        // passed again (e.g. Gokyo after Gokyo Ri), but not twice in a row (e.g. a day's end and the next day's start).
        const positions = placePositions(), events = [];
        for (const leg of legs) {
            for (const { text, k } of trackPlaces(leg.track)) {
                if (events.length && events[events.length - 1].text === text) continue;
                const pos = positions.get(text);
                events.push({ text, s: leg.offset + leg.st.cum[k], marker: makeTrailMarker(text, () => pos, leg.cum.ele[k]) });
            }
        }
        animMarkers = events.map(e => e.marker);

        // Camera keys at the trek's start and each track's end: [x, y, z, heading in degrees]
        const keyS = [0], keyPts = [trackPoint(tracks[0], 0)()], keyHeadings = [null], keyTurnThrough = [false], keyLoop = [false];
        for (const leg of legs) {
            const end = leg.offset + leg.len;
            if (end <= keyS[keyS.length - 1] + 1) continue;  // skip empty tracks
            const display = trackLabels[leg.track.userData.trackIdx].display;
            keyS.push(end);
            keyPts.push(trackPoint(leg.track, leg.st.cum.length - 1)());
            keyHeadings.push(FLY_HEADINGS[display] ?? null);
            keyTurnThrough.push(FLY_TURN_THROUGH.includes(display));
            keyLoop.push(trackLabels[leg.track.userData.trackIdx].endMode === 'none');
        }
        // A loop day (a single place, like the rest day at Namche) ends where it started, so the camera would go back
        // and forth. Instead it creeps a little toward the next key, slowing into the loop and crossing it gently.
        const gentle = [];
        keyLoop.forEach((loop, k) => {
            if (!loop || k === 0 || k === keyS.length - 1) return;
            keyPts[k] = keyPts[k - 1].clone().lerp(keyPts[k + 1], FLY_LOOP_DRIFT);
            keyTurnThrough[k] = true;
            gentle[k - 1] = gentle[k] = true;
        });
        const target = smoothSpline(keyS, keyPts.map(v => [v.x, v.y, v.z]), gentle);
        // Keys without a set heading face along the camera's path (north is -z, east is +x)
        const headingS = [], headings = [];
        keyHeadings.forEach((h, k) => {
            if (keyTurnThrough[k]) return;
            const a = target(keyS[k] - 1), b = target(keyS[k] + 1);
            headingS.push(keyS[k]);
            headings.push(h ?? Math.atan2(b[0] - a[0], -(b[2] - a[2])) * 180 / Math.PI);
        });
        for (let k = 1; k < headings.length; k++) {  // unwrap, so each turn goes the short way around
            headings[k] = headings[k - 1] + ((((headings[k] - headings[k - 1]) % 360) + 540) % 360 - 180);
        }
        // Straight between the heading keys, then averaged: each turn spreads evenly over its stretch, never overshooting
        const linear = s => {
            let k = 0;
            while (k < headingS.length - 2 && s > headingS[k + 1]) k++;
            if (headingS.length < 2) return [headings[0]];
            const u = Math.min(Math.max((s - headingS[k]) / (headingS[k + 1] - headingS[k]), 0), 1);
            return [headings[k] + (headings[k + 1] - headings[k]) * u];
        };
        const heading = averagedHeading(linear, total);

        const flightMs = +document.getElementById('sld-flyover-dur').value * 1000;
        // Stops: every place (its label animates meanwhile) and every day's end, merged where they coincide (e.g. a
        // day's end and the next day's start). The trail head isn't one, the flight starts there after the descent.
        const stops = [];
        const addStop = (at, event) => {
            const near = stops.find(st => Math.abs(st.s - at) < 50);
            if (near) near.event = near.event || event;
            else stops.push({ s: at, event });
        };
        for (const e of events) if (e.s > 0) addStop(e.s, e);
        for (const leg of legs) addStop(leg.offset + leg.len, null);
        stops.sort((a, b) => a.s - b.s);
        const STEP = 20, timeAt = flightTable(total, stops.map(st => st.s), STEP);

        // Widths for the stats box, so it doesn't change width while counting
        const km = d => (d / 1000).toFixed(1), m = v => String(Math.round(v));
        let maxEle = 0;
        for (const leg of legs) for (const e of leg.cum.ele) maxEle = Math.max(maxEle, e);
        const widths = { km: km(distBefore).length, ele: m(maxEle).length, gain: m(gainBefore).length };

        fly = { legs, total, events, target, heading, timeAt, step: STEP, widths, flightMs, overview: overviewView(), end: null };
        planStops(stops);
        fly.start = flightView(0);
        $flyStats.innerHTML = ['Day', 'Distance', 'Elevation', 'Gain']
            .map(label => `<div><div class="fly-label">${label}</div><div class="fly-value"></div></div>`).join('');
        fly.valueEls = [...$flyStats.querySelectorAll('.fly-value')];
        $flyStats.style.opacity = 0;
        $flyStats.style.display = 'flex';
        controls.enableDamping = false;  // damping inertia would drift the camera off the path we set each frame
    }

    // The heading averaged over FLY_TURN_SMOOTH_M each way (tabulated every 50 m), so the camera turns in broad sweeps
    // that start before a place and finish after it, while the pulse keeps a constant speed
    function averagedHeading(heading, total) {
        const STEP = 50, n = Math.ceil(total / STEP) + 1, w = Math.round(FLY_TURN_SMOOTH_M / STEP);
        const prefix = new Float64Array(n + 1);
        for (let i = 0; i < n; i++) prefix[i + 1] = prefix[i] + heading(i * STEP)[0];
        const avg = new Float64Array(n);
        for (let i = 0; i < n; i++) {
            const a = Math.max(0, i - w), b = Math.min(n - 1, i + w);
            avg[i] = (prefix[b + 1] - prefix[a]) / (b - a + 1);
        }
        return s => {
            const x = Math.min(Math.max(s / STEP, 0), n - 1), i = Math.min(Math.floor(x), Math.max(n - 2, 0)), f = x - i;
            return [avg[i] + ((avg[i + 1] ?? avg[i]) - avg[i]) * f];
        };
    }

    // Time to route distance while moving, tabulated every step meters (timeAt[i]: time to reach i * step, in
    // arbitrary units). Constant speed, so days take time in proportion to their distance, except within FLY_BRAKE_M
    // of a stop, where speed goes as the square root of the distance to it: constant deceleration to a standstill.
    function flightTable(total, stopS, step) {
        const steps = Math.max(1, Math.ceil(total / step));
        const timeAt = new Float64Array(steps + 1);
        for (let i = 1; i <= steps; i++) {
            const d = (i - 0.5) * step;
            let speed = 1;
            for (const ss of stopS) speed = Math.min(speed, Math.sqrt(Math.min(Math.abs(d - ss) / FLY_BRAKE_M, 1)));
            timeAt[i] = timeAt[i - 1] + step / speed;
        }
        return timeAt;
    }

    // Moving time (ms, eased in and out over FLY_RAMP_MS) at which the pulse reaches route distance s, and back
    function rampTau(m, movingMs) {
        const R = FLY_RAMP_MS, tauMax = movingMs - R;
        return m < R ? m * m / (2 * R) : m > movingMs - R ? tauMax - (movingMs - m) ** 2 / (2 * R) : m - R / 2;
    }
    function rampMoving(tau, movingMs) {
        const R = FLY_RAMP_MS, tauMax = movingMs - R;
        return tau < R / 2 ? Math.sqrt(2 * R * tau) : tau > tauMax - R / 2 ? movingMs - Math.sqrt(2 * R * (tauMax - tau)) : tau + R / 2;
    }

    // Lays out the stops in flight time: the flight is FLY_PAUSE_MS longer per stop than its moving time
    function planStops(stops) {
        const { timeAt, step, flightMs } = fly, units = timeAt[timeAt.length - 1];
        const pauseMs = Math.min(FLY_PAUSE_MS, flightMs / 2 / Math.max(stops.length, 1));  // keep time to move
        const movingMs = flightMs - pauseMs * stops.length;
        stops.forEach((st, i) => {
            const x = st.s / step, k = Math.min(Math.floor(x), timeAt.length - 2);
            const u = timeAt[k] + (timeAt[k + 1] - timeAt[k]) * (x - k);  // table time at the stop
            st.moving = rampMoving(u / units * (movingMs - FLY_RAMP_MS), movingMs);
            st.start = st.moving + i * pauseMs;  // flight time the stop begins
            if (st.event) st.event.growStart = st.start;
        });
        Object.assign(fly, { stops, pauseMs, movingMs });
    }

    // Route distance after t ms of flight: moving (eased in and out over FLY_RAMP_MS, braking near stops) except
    // while at a stop
    function flightDistance(t) {
        const { timeAt, step, total, stops, pauseMs, movingMs } = fly;
        let passed = 0;
        for (const st of stops) {
            if (t < st.start) break;
            if (t < st.start + pauseMs) return st.s;
            passed++;
        }
        const tau = rampTau(Math.min(Math.max(t - passed * pauseMs, 0), movingMs), movingMs);
        const target = Math.min(Math.max(tau / (movingMs - FLY_RAMP_MS), 0), 1) * timeAt[timeAt.length - 1];
        let lo = 0, hi = timeAt.length - 1;
        while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (timeAt[mid] <= target) lo = mid; else hi = mid; }
        const f = timeAt[hi] > timeAt[lo] ? (target - timeAt[lo]) / (timeAt[hi] - timeAt[lo]) : 0;
        return Math.min((lo + f) * step, total);
    }

    // Route distance averaged over FLY_TURN_TIME_MS each way (less near the flight's ends, so it matches there):
    // smooth through the stops, so the camera keeps drifting slowly while the pulse stands still
    function turnDistance(t) {
        const w = Math.min(FLY_TURN_TIME_MS, t, fly.flightMs - t);
        if (w <= 0) return flightDistance(t);
        let sum = 0;
        for (let i = 0; i <= 8; i++) sum += flightDistance(t - w + 2 * w * i / 8);
        return sum / 9;
    }

    // The camera's view at route distance s, facing the heading at route distance sTurn
    function flightView(s, sTurn = s) {
        const [x, y, z] = fly.target(s), [h] = fly.heading(sTurn);
        // The camera sits behind the trail point: theta = -heading puts north-facing at theta 0. It then aims a bit
        // above the point, which tilts the view up without moving the camera.
        const trail = new THREE.Vector3(x, y, z);
        const camPos = new THREE.Vector3().setFromSpherical(
            new THREE.Spherical(FLY_DISTANCE_M * S.scale, FLY_POLAR, -THREE.MathUtils.degToRad(h))).add(trail);
        const aim = trail.add(new THREE.Vector3(0, FLY_AIM_UP_M * S.scale, 0));
        return { target: aim, sph: new THREE.Spherical().setFromVector3(camPos.sub(aim)) };
    }

    function updateFlyStats(s, opacity) {
        const { legs, widths } = fly;
        // At a day boundary it's still the day just finished: the next day counts once the pulse moves into it
        let li = 0;
        while (li < legs.length - 1 && s > legs[li + 1].offset) li++;
        const leg = legs[li], pc = leg.st.cum, n = pc.length, d = s - leg.offset;
        let k = 0, hi = n - 1;
        while (k < hi) { const mid = (k + hi + 1) >> 1; if (pc[mid] <= d) k = mid; else hi = mid - 1; }
        const k1 = Math.min(k + 1, n - 1), f = pc[k1] > pc[k] ? Math.min((d - pc[k]) / (pc[k1] - pc[k]), 1) : 0;
        const at = a => a[k] + (a[k1] - a[k]) * f;
        // Numbers are padded to their final width (monospace), so the columns don't shift while counting
        const value = (num, unit) => num + (unit ? `<span class="fly-unit"> ${unit}</span>` : '');
        const values = [
            value(trackLabels[leg.track.userData.trackIdx].day.replace(/^D/, '') || '–'),
            value(((leg.distBefore + at(leg.cum.dist)) / 1000).toFixed(1).padStart(widths.km), 'km'),
            value(String(Math.round(at(leg.cum.ele))).padStart(widths.ele), 'm'),
            value(String(Math.round(leg.gainBefore + at(leg.cum.gain))).padStart(widths.gain), 'm'),
        ];
        values.forEach((html, i) => { if (fly.valueEls[i].innerHTML !== html) fly.valueEls[i].innerHTML = html; });
        $flyStats.style.opacity = opacity;
    }

    function updateFlyover(t) {
        const clamp01 = x => Math.min(Math.max(x, 0), 1);
        const descentEnd = FLY_OVERVIEW_MS + FLY_DESCENT_MS, flightEnd = descentEnd + fly.flightMs;
        const zoomEnd = flightEnd + FLY_ZOOM_OUT_MS, holdEnd = zoomEnd + FLY_HOLD_MS;
        if (t >= holdEnd) { stopTrackAnimation(); return; }

        const s = t < descentEnd ? 0 : flightDistance(Math.min(t - descentEnd, fly.flightMs));
        if (t < FLY_OVERVIEW_MS) {
            const left = 1 - t / FLY_OVERVIEW_MS;
            setCameraBetween(fly.overview, fly.overview, 0, 1 + ZOOM_HOLD_DRIFT * left * left);  // eases out of the drift
        } else if (t < descentEnd) {
            setCameraBetween(fly.overview, fly.start, smoothstep(0, 1, (t - FLY_OVERVIEW_MS) / FLY_DESCENT_MS));
        } else if (t < flightEnd) {
            const view = flightView(turnDistance(t - descentEnd));
            setCameraBetween(view, view, 0);
        } else {
            if (!fly.end) fly.end = flightView(fly.total);
            const hold = clamp01((t - zoomEnd) / FLY_HOLD_MS);
            setCameraBetween(fly.end, fly.overview, smoothstep(0, 1, (t - flightEnd) / FLY_ZOOM_OUT_MS), 1 + ZOOM_HOLD_DRIFT * hold * hold);
        }

        // The trail head's line grows at the end of the descent, the others during their stop. Each fades out while
        // the next one grows, so at most one shows at a time. When zooming out, the last one fades out and all place
        // labels fade in.
        const growth = e => e.s <= 0
            ? clamp01((t - (descentEnd - MARKER_MS)) / MARKER_MS)
            : clamp01((t - descentEnd - e.growStart) / FLY_GROW_MS);
        const markerFade = 1 - clamp01((t - flightEnd) / FLY_MARKER_OUT_MS);
        fly.events.forEach((e, i) => {
            const next = fly.events[i + 1];
            updateTrailMarker(e.marker, growth(e), (next ? 1 - growth(next) : 1) * markerFade);
        });
        if (t >= zoomEnd - FLY_LABELS_IN_MS) {
            if (!zoomLabels.length) makeZoomLabels();
            setZoomLabelOpacity(clamp01((t - (zoomEnd - FLY_LABELS_IN_MS)) / FLY_LABELS_IN_MS));
        }
        for (const leg of fly.legs) updatePulseOn(leg.st, s - leg.offset, t >= descentEnd, 0, FLY_PULSE_RADIUS_M);
        updateFlyStats(s, clamp01((t - (descentEnd - FLY_STATS_FADE_MS)) / FLY_STATS_FADE_MS));
        if (document.getElementById('sel-sky').value === 'night-to-day') applyNightToDay(s / fly.total);
    }

    function stopTrackAnimation() {
        trackAnimating = false;
        $btnAnimate.classList.remove('playing');
        $btnAnimate.innerHTML = '&#9654;';
        stopAllCameraMotion();
        stopPulse();
        removeZoomLabels();
        $trekStats.style.display = 'none';
        controls.enableDamping = true;
        zoomIn = null;
        if (zoomOut) {
            zoomOut = null;
            // The zoom-out de-highlighted the track; it's still the selected one
            animTrack.material.color.set(document.getElementById('clr-highlight').value);
            animTrack.position.y = +document.getElementById('sld-track-offset').value + HIGHLIGHT_LIFT;
        }
        removeTrailMarkers();
        stopAnimStats();
        fly = null;
        $flyStats.style.display = 'none';
        updateSky();  // back to the sky's starting state (night for Night to day)
        if (controlsWereVisible) $rotBox.classList.add('active');
        $frameGuide.classList.add('active');
    }

    $btnAnimate.addEventListener('click', () => {
        if (!scene) return;
        if (trackAnimating) { stopTrackAnimation(); return; }
        // With a track selected, animate it; with none, fly over the whole trek
        const hlIdx = document.getElementById('sel-highlight').value;
        animTrack = null;
        if (hlIdx !== '') scene.traverse(o => { if (o.name === 'gpx-track' && o.userData.trackIdx === +hlIdx) animTrack = o; });
        if (hlIdx !== '' ? !animTrack : !allTracks().length) return;
        trackAnimating = true;
        $btnAnimate.classList.add('playing');
        $btnAnimate.innerHTML = '&#9646;&#9646;';
        trackAnimStart = performance.now();
        // Keep the frame clean while animating; the A key still stops it
        controlsWereVisible = $rotBox.classList.contains('active');
        $rotBox.classList.remove('active');
        $frameGuide.classList.remove('active');
        if (!animTrack) { startFlyover(); return; }
        animOverview = document.getElementById('sel-overview').value;
        timelineStarted = false;
        startPulse();
        startAnimStats();
        const animEle = trackCumStats[animTrack.userData.trackIdx].ele;
        animMarkers = [makeTrailMarker(document.getElementById('txt-start-label').value, trackPoint(animTrack, 0), animEle[0])];
        animEndMode = document.getElementById('sel-end-marker').value;
        if (animEndMode !== 'none') {
            const farIdx = trackFarthestIdx[animTrack.userData.trackIdx];
            const totalDist = pulseCum[pulseCum.length - 1];
            animFarFrac = totalDist > 0 ? pulseCum[farIdx] / totalDist : 0;
            const endIdx = animEndMode === 'farthest' ? farIdx : animTrack.userData.positions.length / 3 - 1;
            animMarkers.push(makeTrailMarker(document.getElementById('txt-end-label').value, trackPoint(animTrack, endIdx), animEle[endIdx]));
        }
        // Camera motion starts with the animation proper (startTimeline), after the zoom-in if there is one
        if (animOverview === 'in') startZoomIn();
    });

    document.getElementById('sld-animate-dur').addEventListener('input', e => {
        document.getElementById('animate-dur-val').textContent = e.target.value + 's';
    });
    document.getElementById('sld-flyover-dur').addEventListener('input', e => {
        document.getElementById('flyover-dur-val').textContent = e.target.value + 's';
    });

    // ── Keyboard Shortcuts ────────────────────────────────────────

    const KEY_ROT = 0.03;

    // Let focused form controls keep keys they use natively (type-ahead, arrow stepping)
    function isKeyClaimedByFocus(e) {
        const el = e.target;
        if (el.isContentEditable || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return true;
        if (el.tagName !== 'INPUT') return false;
        if (el.type === 'range') return e.key.startsWith('Arrow');
        return !['checkbox', 'color', 'file', 'button'].includes(el.type);
    }

    document.addEventListener('keydown', e => {
        if (isKeyClaimedByFocus(e)) return;
        if (e.key === 'c' || e.key === 'C') {
            $rotBox.classList.toggle('active');
        }
        if (e.key === 'a' || e.key === 'A') {
            $btnAnimate.click();
        }
        if (e.key === 's' || e.key === 'S') {
            document.getElementById('stats-box').classList.toggle('active');
        }
        if (!controls) return;
        const sphere = new THREE.Spherical().setFromVector3(
            camera.position.clone().sub(controls.target)
        );
        if (e.key === 'ArrowLeft')  { sphere.theta -= KEY_ROT; e.preventDefault(); }
        if (e.key === 'ArrowRight') { sphere.theta += KEY_ROT; e.preventDefault(); }
        if (e.key === 'ArrowUp')    { sphere.phi = Math.max(0.1, sphere.phi - KEY_ROT); e.preventDefault(); }
        if (e.key === 'ArrowDown')  { sphere.phi = Math.min(Math.PI * 0.85, sphere.phi + KEY_ROT); e.preventDefault(); }
        camera.position.copy(new THREE.Vector3().setFromSpherical(sphere).add(controls.target));
    });

    // ── Events ──────────────────────────────────────────────────

    $fileInput.addEventListener('change', e => { if (e.target.files.length) processFiles(e.target.files); });

    $dropzone.addEventListener('dragover', e => { e.preventDefault(); $dropzone.classList.add('dragover'); });
    $dropzone.addEventListener('dragleave', () => $dropzone.classList.remove('dragover'));
    $dropzone.addEventListener('drop', e => {
        e.preventDefault();
        $dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
    });

    // ── Scene export/import ──
    // Scene file layout: magic, uint32 header length, JSON header, elevation grid (Float64), then one JPEG per
    // texture tile. Keeping the bulky parts binary avoids building one huge string: browsers cap strings at about
    // 512M characters, which multi-tile high-resolution scenes exceed as base64 JSON.
    const SCENE_MAGIC = 'GPX3DSCN';

    function encodeTile(canvas) {
        // JPEG keeps large multi-tile exports manageable; the satellite source tiles are JPEG anyway
        return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('Could not encode texture tile')), 'image/jpeg', 0.92));
    }

    const $btnExport = document.getElementById('btn-export');
    $btnExport.addEventListener('click', async () => {
        if (!cachedTerrainData) return;
        $btnExport.disabled = true;
        $btnExport.textContent = 'Exporting…';
        try {
            const { texTiles, elev, ...rest } = cachedTerrainData;
            const tileBlobs = [];
            for (const t of texTiles) tileBlobs.push(await encodeTile(t.canvas));  // one at a time to limit memory
            const header = new TextEncoder().encode(JSON.stringify({
                ...rest,
                elevBytes: elev.byteLength,
                texTiles: texTiles.map((t, i) => ({ offset: t.offset, repeat: t.repeat, bytes: tileBlobs[i].size })),
            }));
            const headerLen = new Uint8Array(4);
            new DataView(headerLen.buffer).setUint32(0, header.length, true);
            const blob = new Blob([SCENE_MAGIC, headerLen, header, elev, ...tileBlobs], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'scene-data.gpx3d';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 60000);  // give large downloads time to start
        } catch (err) {
            console.error(err);
            alert('Export failed: ' + err.message);
        } finally {
            $btnExport.disabled = false;
            $btnExport.textContent = 'Export scene data';
        }
    });

    async function canvasFromImage(src) {
        // src is a Blob from a scene file, or a data URL from an older JSON export
        const img = src instanceof Blob ? await createImageBitmap(src) : await new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = () => rej(new Error('Could not decode texture tile'));
            i.src = src;
        });
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        if (img.close) img.close();
        return canvas;
    }

    async function readSceneFile(file, onTile) {
        const bytes = async (start, end) => new Uint8Array(await file.slice(start, end).arrayBuffer());

        if (new TextDecoder().decode(await bytes(0, SCENE_MAGIC.length)) !== SCENE_MAGIC) {
            // Older JSON export
            const data = JSON.parse(await file.text());
            if (!data.texTiles) throw new Error('Unsupported scene file');
            const texTiles = [];
            for (const [i, t] of data.texTiles.entries()) {
                texTiles.push({ canvas: await canvasFromImage(t.dataURL), offset: t.offset, repeat: t.repeat });
                onTile(i + 1, data.texTiles.length);
            }
            return { ...data, elev: new Float64Array(data.elev), texTiles };
        }

        let pos = SCENE_MAGIC.length;
        const headerLen = new DataView((await bytes(pos, pos + 4)).buffer).getUint32(0, true);
        pos += 4;
        const { elevBytes, texTiles: tileInfo, ...rest } = JSON.parse(new TextDecoder().decode(await bytes(pos, pos + headerLen)));
        pos += headerLen;
        const elev = new Float64Array(await file.slice(pos, pos + elevBytes).arrayBuffer());
        pos += elevBytes;
        const texTiles = [];
        for (const [i, t] of tileInfo.entries()) {
            texTiles.push({ canvas: await canvasFromImage(file.slice(pos, pos + t.bytes, 'image/jpeg')), offset: t.offset, repeat: t.repeat });
            pos += t.bytes;
            onTile(i + 1, tileInfo.length);
        }
        if (pos !== file.size) throw new Error('Scene file is truncated or corrupt');
        return { ...rest, elev, texTiles };
    }

    document.getElementById('import-input').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        $landing.style.display = 'none';
        $progress.classList.add('active');
        prog('Loading scene data...', 20);
        try {
            const scene = await readSceneFile(file, (d, t) => prog('Restoring texture...', 30 + (d / t) * 55, `Tile ${d} / ${t}`));
            const { elev, bb, gw, gh, texTiles } = scene;
            const tracks = (scene.tracks || []).map(pts =>
                pts.map(p => ({ ...p, time: p.time ? new Date(p.time) : null }))
            );
            const trackNames = scene.trackNames || [];

            cachedTerrainData = scene;

            prog('Building 3D scene...', 90);
            await new Promise(r => setTimeout(r, 80));
            buildScene(elev, texTiles, tracks, bb, gw, gh);

            prog('Done!', 100);
            await new Promise(r => setTimeout(r, 350));
            showViewer(tracks, trackNames);
        } catch (err) {
            prog('Error', 0, err.message);
            console.error(err);
        }
    });

    </script>
</body>
</html>
