<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    background: #333; color: #e0e0e0;
  }

  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  #header h1 { font-size: 18px; color: #fff; white-space: nowrap; }
  #file-input {
    max-width: 200px; padding: 4px 8px;
    border: 1px solid #555; border-radius: 6px;
    background: #333; color: #e0e0e0; font-size: 12px;
    cursor: pointer;
  }
  #file-input::file-selector-button {
    background: #fff; color: #222; border: none;
    padding: 4px 12px; border-radius: 4px; cursor: pointer;
    margin-right: 8px; font-size: 13px;
  }
  #settings-wrapper {
    position: relative; margin-left: auto;
  }
  #settings-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid #555; border-radius: 6px;
    background: transparent; color: #fff; font-size: 13px; cursor: pointer;
  }
  #settings-btn:hover { background: rgba(255,255,255,0.1); }
  #settings-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 200px; padding: 12px;
    background: rgba(51, 51, 51, 0.85); backdrop-filter: blur(6px);
    border: 1px solid #555; border-radius: 8px; z-index: 1001;
  }
  #settings-dropdown.open { display: block; }
  #settings-dropdown label {
    display: block; font-size: 11px; text-transform: uppercase;
    color: #fff; margin-bottom: 6px; letter-spacing: 0.5px;
  }
  #tile-select {
    width: 100%; padding: 6px 10px; border: 1px solid #555; border-radius: 6px;
    background: #333; color: #e0e0e0; font-size: 13px; cursor: pointer;
  }
  #track-name { font-size: 20px; font-weight: 600; color: #fff; }

  #map-wrapper { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .leaflet-tile-pane { filter: brightness(1); }
  .leaflet-top.leaflet-left { top: 52px; }

  #overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 1000; pointer-events: none;
  }
  #overlay > * { pointer-events: auto; }

  #stats {
    display: none; padding: 14px 20px;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
  }
  #stats-grid {
    display: flex; flex-wrap: wrap; gap: 8px 32px;
    justify-content: center;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center;
    min-width: 120px;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; color: #fff; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 600; color: #fff; }
  .stat-unit { font-size: 12px; color: #fff; }

  #elevation-chart {
    display: none; height: 100px; padding: 8px 20px 4px;
    background: rgba(51, 51, 51, 0.65); backdrop-filter: blur(3px);
  }
  #elevation-canvas { width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="header">
  <h1>GPX Viewer</h1>
  <input type="file" id="file-input" accept=".gpx" multiple>
  <span id="track-name"></span>
  <div id="settings-wrapper">
    <button id="settings-btn">
      Settings
    </button>
    <div id="settings-dropdown">
      <label for="tile-select">Map type</label>
      <select id="tile-select"></select>
      <label for="map-brightness" style="margin-top:10px;">Map brightness</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="map-brightness" min="0" max="1" step="0.05" value="1" style="flex:1;">
        <span id="map-brightness-value" style="font-size:13px; color:#fff; min-width:28px; text-align:right;">1</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <label for="line-color" style="margin:0;">Line color</label>
        <input type="color" id="line-color" value="#e94560" style="margin-left:auto; width:48px; height:28px; border:1px solid #555; border-radius:4px; background:transparent; cursor:pointer; padding:0;">
      </div>
      <label for="line-width" style="margin-top:10px;">Line width</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="line-width" min="1" max="10" step="0.5" value="4" style="flex:1;">
        <span id="line-width-value" style="font-size:13px; color:#fff; min-width:28px; text-align:right;">4</span>
      </div>
      <label for="line-alpha" style="margin-top:10px;">Line opacity</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="line-alpha" min="0" max="1" step="0.05" value="0.85" style="flex:1;">
        <span id="line-alpha-value" style="font-size:13px; color:#fff; min-width:28px; text-align:right;">0.85</span>
      </div>
      <label for="smoothing" style="margin-top:10px;">Smoothing</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="smoothing" min="0" max="50" step="1" value="5" style="flex:1;">
        <span id="smoothing-value" style="font-size:13px; color:#fff; min-width:28px; text-align:right;">5</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <label for="show-elevation" style="margin:0;">Elevation chart</label>
        <input type="checkbox" id="show-elevation" checked style="margin-left:auto;">
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <label for="show-zoom" style="margin:0;">Zoom controls</label>
        <input type="checkbox" id="show-zoom" style="margin-left:auto;">
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <label for="show-start-marker" style="margin:0;">Start marker</label>
        <input type="checkbox" id="show-start-marker" checked style="margin-left:auto;">
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <label for="show-end-marker" style="margin:0;">End marker</label>
        <input type="checkbox" id="show-end-marker" checked style="margin-left:auto;">
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <label for="show-highest" style="margin:0;">Highest point</label>
        <input type="checkbox" id="show-highest" style="margin-left:auto;">
      </div>
    </div>
  </div>
</div>

<div id="map-wrapper">
  <div id="map"></div>
  <div id="overlay">
    <div id="elevation-chart">
      <canvas id="elevation-canvas"></canvas>
    </div>
    <div id="stats">
      <div id="stats-grid"></div>
    </div>
  </div>
</div>

<script>
const tileLayers = {
  'OpenTopoMap': { url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', maxZoom: 17, attr: '&copy; OpenTopoMap' },
  'OpenStreetMap': { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom: 19, attr: '&copy; OpenStreetMap contributors' },
  'OSM Hot': { url: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', maxZoom: 19, attr: '&copy; OpenStreetMap contributors, HOT style' },
  'CyclOSM': { url: 'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', maxZoom: 20, attr: '&copy; CyclOSM / OpenStreetMap' },
  'CartoDB Positron': { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', maxZoom: 20, attr: '&copy; CARTO, OSM' },
  'CartoDB Dark Matter': { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', maxZoom: 20, attr: '&copy; CARTO, OSM' },
  'CartoDB Voyager': { url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', maxZoom: 20, attr: '&copy; CARTO, OSM' },
  'Esri World Street Map': { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attr: '&copy; Esri' },
  'Esri World Topo': { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attr: '&copy; Esri' },
  'Esri World Imagery': { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attr: '&copy; Esri' },
};

const map = L.map('map', { zoomControl: false }).setView([47.5, 19.0], 6);
map.zoomControl = L.control.zoom();

let currentTile = null;

const select = document.getElementById('tile-select');
Object.keys(tileLayers).forEach(name => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  select.appendChild(opt);
});

function setTileLayer(name) {
  const t = tileLayers[name];
  if (currentTile) map.removeLayer(currentTile);
  currentTile = L.tileLayer(t.url, { maxZoom: t.maxZoom, attribution: t.attr }).addTo(map);
}

select.addEventListener('change', () => setTileLayer(select.value));
setTileLayer(select.value);

const mapBrightnessSlider = document.getElementById('map-brightness');
const mapBrightnessValue = document.getElementById('map-brightness-value');
mapBrightnessSlider.addEventListener('input', () => {
  mapBrightnessValue.textContent = mapBrightnessSlider.value;
  map.getPane('tilePane').style.filter = 'brightness(' + mapBrightnessSlider.value + ')';
});

const settingsBtn = document.getElementById('settings-btn');
const settingsDropdown = document.getElementById('settings-dropdown');
settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsDropdown.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!settingsDropdown.contains(e.target) && e.target !== settingsBtn) {
    settingsDropdown.classList.remove('open');
  }
});

const lineWidthSlider = document.getElementById('line-width');
const lineWidthValue = document.getElementById('line-width-value');
const lineColorPicker = document.getElementById('line-color');
lineColorPicker.addEventListener('input', () => {
  allTracks.forEach(t => { if (t.trackLayer) t.trackLayer.setStyle({ color: lineColorPicker.value }); });
});

lineWidthSlider.addEventListener('input', () => {
  lineWidthValue.textContent = lineWidthSlider.value;
  allTracks.forEach(t => { if (t.trackLayer) t.trackLayer.setStyle({ weight: parseFloat(lineWidthSlider.value) }); });
});

const lineAlphaSlider = document.getElementById('line-alpha');
const lineAlphaValue = document.getElementById('line-alpha-value');
lineAlphaSlider.addEventListener('input', () => {
  lineAlphaValue.textContent = lineAlphaSlider.value;
  allTracks.forEach(t => { if (t.trackLayer) t.trackLayer.setStyle({ opacity: parseFloat(lineAlphaSlider.value) }); });
});

const showElevation = document.getElementById('show-elevation');
showElevation.addEventListener('change', () => {
  const chart = document.getElementById('elevation-chart');
  if (showElevation.checked && lastElevationData) {
    chart.style.display = 'block';
    drawElevationChart(lastElevationData);
  } else {
    chart.style.display = 'none';
  }
});

const showZoom = document.getElementById('show-zoom');
showZoom.addEventListener('change', () => {
  if (showZoom.checked) {
    map.addControl(map.zoomControl);
  } else {
    map.removeControl(map.zoomControl);
  }
});

const showStartMarker = document.getElementById('show-start-marker');
showStartMarker.addEventListener('change', () => {
  allTracks.forEach(t => {
    if (!t.markerStart) return;
    if (showStartMarker.checked) t.markerStart.addTo(map);
    else map.removeLayer(t.markerStart);
  });
});

const showEndMarker = document.getElementById('show-end-marker');
showEndMarker.addEventListener('change', () => {
  allTracks.forEach(t => {
    if (!t.markerEnd) return;
    if (showEndMarker.checked) t.markerEnd.addTo(map);
    else map.removeLayer(t.markerEnd);
  });
});

const showHighest = document.getElementById('show-highest');
showHighest.addEventListener('change', () => {
  allTracks.forEach(t => {
    if (!t.markerHighest) return;
    if (showHighest.checked) t.markerHighest.addTo(map);
    else map.removeLayer(t.markerHighest);
  });
});

let allTracks = [];

const smoothingSlider = document.getElementById('smoothing');
const smoothingValue = document.getElementById('smoothing-value');
smoothingSlider.addEventListener('input', () => {
  smoothingValue.textContent = smoothingSlider.value;
  if (allTracks.length > 0) renderAllTracks();
});

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  files.sort((a, b) => a.name.localeCompare(b.name));
  let loaded = 0;
  const parsed = new Array(files.length);
  files.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = ev => {
      parsed[idx] = parseGPX(ev.target.result);
      loaded++;
      if (loaded === files.length) {
        allTracks = parsed.filter(t => t !== null);
        if (allTracks.length > 0) renderAllTracks();
      }
    };
    reader.readAsText(file);
  });
});

function parseGPX(xmlStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, 'application/xml');

  const trk = doc.querySelector('trk');
  const name = trk?.querySelector('name')?.textContent || 'Unnamed';
  const type = trk?.querySelector('type')?.textContent || 'Unknown';

  const rawPoints = [];
  doc.querySelectorAll('trkpt').forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    const eleEl = pt.querySelector('ele');
    const timeEl = pt.querySelector('time');
    rawPoints.push({
      lat, lon,
      ele: eleEl ? parseFloat(eleEl.textContent) : null,
      time: timeEl ? new Date(timeEl.textContent) : null,
    });
  });

  if (rawPoints.length === 0) return null;
  return { rawPoints, name, type, trackLayer: null, markerStart: null, markerEnd: null, markerHighest: null };
}

function smoothPoints(points, window) {
  if (window <= 0) return points;
  const half = Math.floor(window / 2);
  return points.map((p, i) => {
    const start = Math.max(0, i - half);
    const end = Math.min(points.length - 1, i + half);
    let lat = 0, lon = 0, ele = 0, eleCount = 0;
    for (let j = start; j <= end; j++) {
      lat += points[j].lat;
      lon += points[j].lon;
      if (points[j].ele != null) { ele += points[j].ele; eleCount++; }
    }
    const n = end - start + 1;
    return {
      lat: lat / n, lon: lon / n,
      ele: eleCount > 0 ? ele / eleCount : p.ele,
      time: p.time,
    };
  });
}

function renderAllTracks() {
  // Clear all existing layers/markers
  allTracks.forEach(t => {
    if (t.trackLayer) map.removeLayer(t.trackLayer);
    if (t.markerStart) map.removeLayer(t.markerStart);
    if (t.markerEnd) map.removeLayer(t.markerEnd);
    if (t.markerHighest) map.removeLayer(t.markerHighest);
    t.trackLayer = null;
    t.markerStart = null;
    t.markerEnd = null;
    t.markerHighest = null;
  });

  // Track name
  if (allTracks.length === 1) {
    document.getElementById('track-name').textContent = allTracks[0].name;
  } else {
    document.getElementById('track-name').textContent = allTracks.length + ' tracks';
  }

  const smoothWindow = parseInt(smoothingSlider.value);
  const allBounds = L.latLngBounds();
  const elevationSegments = [];

  // Aggregated stats accumulators
  let totalDist = 0, totalElevGain = 0;
  let globalMinEle = Infinity, globalMaxEle = -Infinity;
  let totalElapsedSec = 0, hasElapsed = false;
  let totalMovingSec = 0, hasMoving = false;
  let earliestDate = null, latestDate = null;
  const types = new Set();

  allTracks.forEach(track => {
    const points = smoothPoints(track.rawPoints, smoothWindow);

    // Draw polyline
    const latlngs = points.map(p => [p.lat, p.lon]);
    track.trackLayer = L.polyline(latlngs, {
      color: lineColorPicker.value,
      weight: parseFloat(lineWidthSlider.value),
      opacity: parseFloat(lineAlphaSlider.value),
    }).addTo(map);
    allBounds.extend(track.trackLayer.getBounds());

    // Start / End markers
    const startIcon = L.divIcon({ className: '', html: '<div style="width:14px;height:14px;background:#00c853;border:2px solid #fff;border-radius:50%;"></div>', iconSize: [14,14], iconAnchor: [7,7] });
    const endIcon = L.divIcon({ className: '', html: '<div style="width:14px;height:14px;background:#e94560;border:2px solid #fff;border-radius:50%;"></div>', iconSize: [14,14], iconAnchor: [7,7] });
    track.markerStart = L.marker(latlngs[0], { icon: startIcon }).bindPopup('Start');
    if (showStartMarker.checked) track.markerStart.addTo(map);
    track.markerEnd = L.marker(latlngs[latlngs.length - 1], { icon: endIcon }).bindPopup('End');
    if (showEndMarker.checked) track.markerEnd.addTo(map);

    // Highest point marker
    let highestIdx = -1, highestEle = -Infinity;
    for (let i = 0; i < points.length; i++) {
      if (points[i].ele != null && points[i].ele > highestEle) { highestEle = points[i].ele; highestIdx = i; }
    }
    if (highestIdx >= 0) {
      const highIcon = L.divIcon({ className: '', html: '<div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #2196f3;filter:drop-shadow(0 0 2px rgba(0,0,0,0.5));"></div>', iconSize: [16,14], iconAnchor: [8,14] });
      track.markerHighest = L.marker([points[highestIdx].lat, points[highestIdx].lon], { icon: highIcon }).bindPopup('Highest: ' + Math.round(highestEle) + ' m');
      if (showHighest.checked) track.markerHighest.addTo(map);
    }

    // Per-track stats
    let trackDist = 0, elevGain = 0;
    let minEle = Infinity, maxEle = -Infinity;
    const distances = [0];

    for (let i = 1; i < points.length; i++) {
      const d = haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
      trackDist += d;
      distances.push(trackDist);
      if (points[i].ele != null && points[i - 1].ele != null) {
        const diff = points[i].ele - points[i - 1].ele;
        if (diff > 0) elevGain += diff;
      }
      if (points[i].ele != null) {
        if (points[i].ele < minEle) minEle = points[i].ele;
        if (points[i].ele > maxEle) maxEle = points[i].ele;
      }
    }
    if (points[0].ele != null) {
      if (points[0].ele < minEle) minEle = points[0].ele;
      if (points[0].ele > maxEle) maxEle = points[0].ele;
    }

    totalDist += trackDist;
    totalElevGain += elevGain;
    if (minEle < globalMinEle) globalMinEle = minEle;
    if (maxEle > globalMaxEle) globalMaxEle = maxEle;

    // Time stats
    const startTime = points[0].time;
    const endTime = points[points.length - 1].time;
    if (startTime && endTime) {
      totalElapsedSec += (endTime - startTime) / 1000;
      hasElapsed = true;
      if (!earliestDate || startTime < earliestDate) earliestDate = startTime;
      if (!latestDate || endTime > latestDate) latestDate = endTime;
    }
    const movingData = computeMovingTime(points);
    if (movingData) {
      totalMovingSec += movingData.movingSec;
      hasMoving = true;
    }

    types.add(track.type);
    elevationSegments.push({ points, distances });
  });

  map.fitBounds(allBounds, { padding: [30, 30] });

  // Aggregated stats display
  const distKm = totalDist / 1000;
  const activityStr = types.size === 1 ? [...types][0] : 'Multiple';
  const activityDisplay = activityStr.charAt(0).toUpperCase() + activityStr.slice(1);

  let dateStr = '—';
  if (earliestDate) {
    const fmt = d => d.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    if (allTracks.length === 1) {
      dateStr = fmt(earliestDate);
    } else {
      const d1 = fmt(earliestDate);
      const d2 = fmt(latestDate);
      dateStr = d1 === d2 ? d1 : d1 + ' — ' + d2;
    }
  }

  const timeStr = hasElapsed ? formatDuration(totalElapsedSec) : '—';
  const avgSpeed = hasElapsed && totalElapsedSec > 0 ? (distKm / (totalElapsedSec / 3600)).toFixed(1) : '—';
  const movingTimeStr = hasMoving ? formatDuration(totalMovingSec) : '—';
  const movingAvg = (hasMoving && totalMovingSec > 0) ? (distKm / (totalMovingSec / 3600)).toFixed(1) : '—';

  const stats = [
    { label: 'Activity', value: activityDisplay, unit: '' },
    { label: 'Date', value: dateStr, unit: '' },
    { label: 'Distance', value: distKm.toFixed(2), unit: 'km' },
    { label: 'Elapsed Time', value: timeStr, unit: '' },
    { label: 'Moving Time', value: movingTimeStr, unit: '' },
    { label: 'Elev. Gain', value: Math.round(totalElevGain), unit: 'm' },
    { label: 'Min / Max Elev.', value: Math.round(globalMinEle) + ' / ' + Math.round(globalMaxEle), unit: 'm' },
    { label: 'Avg Speed', value: avgSpeed, unit: 'km/h' },
    { label: 'Moving Avg', value: movingAvg, unit: 'km/h' },
  ];

  const grid = document.getElementById('stats-grid');
  grid.innerHTML = '';
  stats.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = `<span class="stat-label">${s.label}</span><span class="stat-value">${s.value} <span class="stat-unit">${s.unit}</span></span>`;
    grid.appendChild(div);
  });
  document.getElementById('stats').style.display = 'block';

  // Elevation chart
  drawElevationChart(elevationSegments);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
}

function computeMovingTime(points) {
  if (!points[0].time) return null;
  let movingSec = 0;
  const speedThreshold = 0.2; // m/s — below this is "stopped"
  for (let i = 1; i < points.length; i++) {
    if (!points[i].time || !points[i - 1].time) continue;
    const dt = (points[i].time - points[i - 1].time) / 1000;
    if (dt <= 0) continue;
    const d = haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
    if (d / dt >= speedThreshold) movingSec += dt;
  }
  return { movingSec };
}

let lastElevationData = null;

function drawElevationChart(segments) {
  lastElevationData = segments;
  const container = document.getElementById('elevation-chart');
  const canvas = document.getElementById('elevation-canvas');

  const hasEle = segments.some(seg => seg.points.some(p => p.ele != null));
  if (!hasEle || !document.getElementById('show-elevation').checked) { container.style.display = 'none'; return; }

  container.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  // Compute global elevation range
  let globalMinE = Infinity, globalMaxE = -Infinity;
  segments.forEach(seg => {
    seg.points.forEach(p => {
      const e = p.ele ?? 0;
      if (e < globalMinE) globalMinE = e;
      if (e > globalMaxE) globalMaxE = e;
    });
  });
  const minE = globalMinE - 20;
  const maxE = globalMaxE + 20;

  // Compute total distance with gaps between segments
  const gapFraction = 0.01; // 1% of total distance per gap
  let totalSegDist = 0;
  segments.forEach(seg => {
    const lastD = seg.distances[seg.distances.length - 1];
    totalSegDist += lastD;
  });
  const gapSize = segments.length > 1 ? totalSegDist * gapFraction : 0;
  const totalWithGaps = totalSegDist + gapSize * (segments.length - 1);

  ctx.clearRect(0, 0, W, H);

  let cumOffset = 0;
  segments.forEach((seg, segIdx) => {
    const segMaxD = seg.distances[seg.distances.length - 1];
    const eles = seg.points.map(p => p.ele ?? 0);

    // Fill
    ctx.beginPath();
    const x0 = ((cumOffset + seg.distances[0]) / totalWithGaps) * W;
    ctx.moveTo(x0, H);
    for (let i = 0; i < seg.points.length; i++) {
      const x = ((cumOffset + seg.distances[i]) / totalWithGaps) * W;
      const y = H - ((eles[i] - minE) / (maxE - minE)) * H;
      ctx.lineTo(x, y);
    }
    const xEnd = ((cumOffset + segMaxD) / totalWithGaps) * W;
    ctx.lineTo(xEnd, H);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(255,255,255,0.4)');
    grad.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    for (let i = 0; i < seg.points.length; i++) {
      const x = ((cumOffset + seg.distances[i]) / totalWithGaps) * W;
      const y = H - ((eles[i] - minE) / (maxE - minE)) * H;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    cumOffset += segMaxD + gapSize;
  });

  // Axis labels
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.fillText(Math.round(maxE) + ' m', 4, 12);
  ctx.fillText(Math.round(minE) + ' m', 4, H - 4);
  ctx.fillText((totalSegDist / 1000).toFixed(1) + ' km', W - 50, H - 4);
}

window.addEventListener('resize', () => {
  if (lastElevationData) drawElevationChart(lastElevationData);
});
</script>
